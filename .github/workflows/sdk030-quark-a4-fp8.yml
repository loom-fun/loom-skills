name: DevLab Quark A4 BF16 with fast FP8 prefill
on:
  push:
    branches: [codex/sdk030-quark-r9700-diagnostic]
    paths: [.github/workflows/sdk030-quark-a4-fp8.yml]
permissions:
  contents: read
  actions: read
jobs:
  fp8:
    runs-on: [self-hosted, devlab-dispatch, Linux, radeon-r9700]
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      VISION_ONLY: '1'
      VISION_ARGS: --cases chart,chart_pre,wide
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 629d8f8aab61f53c4713b89fd21d26efe83f9e45
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare the original FP8 control and optimized Quark precision path
        shell: bash
        run: |
          set -euo pipefail
          work=$(mktemp -d "$(dirname "$GITHUB_WORKSPACE")/sdk030-quark-fp8.XXXXXX")
          echo "WORK=$work" >> "$GITHUB_ENV"
          export WORK="$work"
          mkdir -p "$work/receipt"
          git show fb2ef6d931182381465ce6e1012c90a6c40e842e:.github/scripts/sdk030_quark_a4_prototype.py > "$work/receipt/quark_a4_prefill_prototype.py"
          test "$(git hash-object "$work/receipt/quark_a4_prefill_prototype.py")" = 21acaa6f0336859cc9c3d65ee6c3f163ba7c3119
          git show "$GITHUB_SHA":.github/scripts/sdk030_quark_a4_fp8_prototype.py > "$work/receipt/quark_a4_fp8_prototype.py"
          git rev-parse "$GITHUB_SHA" > "$work/receipt/diagnostic-source.txt"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            'https://api.github.com/repos/loom-fun/loom-skills/actions/artifacts/14944250839/zip' -o "$work/original.zip"
          echo "875d7b88ad5247e4dcbbf816d8f058ab462d946c7d1ba8b6412c3f0c5e8e9bf7  $work/original.zip" | sha256sum -c -
          unzip -p "$work/original.zip" out/gates_chart/llama_cache.tgz > .github/sdk030-quark-refs.tgz
          echo '56bc7cbad90299414ce8c6e05898fc4907a8aa8a6ff797f5c5eec09a462cff03  .github/sdk030-quark-refs.tgz' \
            | sha256sum -c - | tee "$work/receipt/reference-cache.txt"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          work = Path(os.environ["WORK"])
          frozen = "loom-fun/amd-Qwen3.8-27B-Quark-AWQ-MXFP4-loom@a999be30c6539c77a030e961748416892b06ac73"
          shared = {"card": frozen, "sdk": "0.3.0", "context": 32768,
                    "execution": {"context_capacity": 32768, "prefill_capacity": 1024, "rows": 4, "draft_depth": 0}}
          paired = ("baseline", "repairfp8", "repairfp8", "baseline")
          experiment = {"name": "quark-a4-fp8", "card": frozen, "runner": "r9700", "sdk": "0.3.0",
                        "memory_bytes": 34000000000, "memory_bytes_r9700": 34000000000,
                        "require_preset_r9700": True, "reference_cache": ".github/sdk030-quark-refs.tgz",
                        "variants": [dict(shared, name=arm) for arm in ("baseline", "repairfp8")],
                        "steps": ["gates:baseline:quick", "gates:repairfp8:quick"] + [f"perf:{arm}:1" for arm in paired]}
          (work / "receipt/experiment.json").write_text(json.dumps({"jobs": [experiment]}, indent=2) + "\n")

          harness = Path(".github/scripts/devlab_perf.sh")
          source = harness.read_text()
          hook = '  # ablation: every kernel.launch in PROGRAM matching REGEX'
          assert source.count(hook) == 1
          source = source.replace(hook, '''  if [ "$v" = repairfp8 ]; then
              sha256sum "$pkg/program/llm.loom" > "$WORK/receipt/source-before-fp8.txt"
              "$T" - "$WORK/receipt" "$pkg" <<'PATCH_GEN' || exit 1
          import hashlib
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, sys.argv[1])
          from quark_a4_fp8_prototype import apply

          package = Path(sys.argv[2])
          path = package / "program/llm.loom"
          original = path.read_bytes()
          assert hashlib.sha256(original).hexdigest() == "5df0cab4e88b260e8de20a7b02b1b3d866a9c84aee6c61c0e1f76d0d864eed5f"
          repair = apply(original.decode(), json.loads((package / "llm_config.json").read_text()))
          assert "func.call @g_quark_a4_codes(" in repair
          path.write_text(repair)
          PATCH_GEN
              cp "$pkg/program/llm.loom" "$WORK/receipt/fp8-after.loom"
            fi
          ''' + hook)
          hook = '      nref1=$("$T" "$B/reference_cache.py" count "$D/$p1/bench"'
          assert source.count(hook) == 1
          source = source.replace(hook, '''      cp "$D/$p1/bench/vision_golden.json" "$out/gates_$p1/" 2>/dev/null || true
          ''' + hook)
          harness.write_text(source)

          vision = Path("skills/loom-benchmark/scripts/vision_golden.py")
          source = vision.read_text()
          hook = '    out["chart"] = (im, "What is the title of this chart, and which day has the tallest bar?")\n'
          assert source.count(hook) == 1
          source = source.replace(hook, hook + '''    pre = im.resize((800, 512), Image.Resampling.BICUBIC)
              out["chart_pre"] = (pre, out["chart"][1])
          ''')
          vision.write_text(source)
          PY
          bash -n .github/scripts/devlab_perf.sh
      - name: Measure the unchanged chart gate and paired FP8 performance
        shell: bash
        run: bash .github/scripts/devlab_perf.sh "$WORK/receipt/experiment.json" quark-a4-fp8
      - name: Archive exact sources and qualification logs
        if: always() && env.WORK != ''
        shell: bash
        run: |
          set -euo pipefail
          cp -r "$WORK/quark-a4-fp8/out" "$WORK/receipt/"
          for variant in baseline repairfp8; do
            sha256sum "$WORK/quark-a4-fp8/$variant/pkg/program/llm.loom" >> "$WORK/receipt/llm-source-digests.txt"
            grep '^VISION_RESULT ' "$WORK/receipt/out/gates_$variant/gates_vision.log"
          done
          test "$(cut -d' ' -f1 "$WORK/receipt/llm-source-digests.txt" | sort -u | wc -l)" = 2
      - uses: actions/upload-artifact@v4
        if: always() && env.WORK != ''
        with:
          name: sdk030-quark-a4-fp8
          path: ${{ env.WORK }}/receipt
          if-no-files-found: error
          retention-days: 30
      - name: Release job disk
        if: always() && env.WORK != ''
        shell: bash
        run: |
          case "$WORK" in
            "$(dirname "$GITHUB_WORKSPACE")"/sdk030-quark-fp8.*) rm -rf -- "$WORK" ;;
            *) exit 1 ;;
          esac

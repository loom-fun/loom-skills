name: DevLab reuse Gufo binaries for controller ABI proof
on:
  push:
    branches: [codex/sdk030-consumer-devlab]
    paths:
      - .github/workflows/sdk030-controller-abi-retry.yml
permissions:
  actions: read
  contents: read
jobs:
  controller-abi:
    runs-on: [strix-halo, devlab-dispatch, Linux, self-hosted]
    timeout-minutes: 23
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare isolated runner workspace
        shell: bash
        run: |
          set -euo pipefail
          work=$(mktemp -d "$RUNNER_TEMP/sdk030-controller-retry.XXXXXX")
          echo "WORK=$work" >> "$GITHUB_ENV"
          mkdir "$work/out"
          hostname > "$work/out/runner.txt"
      - uses: actions/download-artifact@v4
        with:
          run-id: '45278213432'
          github-token: ${{ github.token }}
          name: sdk030-controller-abi
          path: ${{ env.WORK }}/tested
      - name: Exercise both existing libraries at an 8 MiB memlock limit
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK"
          test "$(git hash-object tested/gufo-loom_text_embed.c)" = f3f6e58481995cf0f10882193160472bd4d0489d
          test "$(git hash-object tested/extension-loom_text_embed.c)" = 5637437260beb37f43c517067107d0a0a1957120
          cp tested/{revisions.txt,gufo-loom_text_embed.c,extension-loom_text_embed.c,gufo-legacy.json} out/
          python3 -m venv "$WORK/venv"
          source "$WORK/venv/bin/activate"
          wheel=hrx_loom-0.3.0-py3-none-manylinux_2_39_x86_64.whl
          curl -fsSL --retry 3 "https://github.com/ROCm/hrx-system/releases/download/v0.3.0/$wheel" -o "$wheel"
          echo "6252bb0df262351175bdb2c4aaca22ffa63d80d791659aa4d2fa5c92a0af426f  $wheel" | sha256sum -c -
          python -m pip install -q "./$wheel[hf]"
          source_rev=e2c41a720363911c04606ce0f4417e2d55630352
          mkdir hrx
          curl -fsSL --retry 3 "https://codeload.github.com/ROCm/hrx-system/tar.gz/$source_rev" -o hrx.tgz
          echo '3b02486d07d32d03901f41915605a21840211db4e93b040dfa55283d68d27fd8  hrx.tgz' | sha256sum -c -
          tar -C hrx --strip-components=1 -xzf hrx.tgz
          fixture="$WORK/hrx/loom/docs/examples/serving/model-publication/model/tiny-text"
          loom-fetch "$fixture/model.json" --materialize=copy --output="$WORK/abi2" --no-input
          legacy=loom-fun/unsloth-Qwen3-0.6B-loom
          legacy_rev=564d578f4e487c6fbabd84915439f873651b5953
          loom-fetch "huggingface:$legacy:chat@$legacy_rev" --materialize=share --output="$WORK/legacy" --no-input
          python - <<'PY'
          import json
          from pathlib import Path
          legacy = json.loads(Path("legacy/model.json").read_text())
          settings = json.loads(Path("legacy/llm_config.json").read_text())
          fixture = json.loads(Path("abi2/model.json").read_text())
          assert settings["sdk"]["hrx_loom"] == "0.2.0" and legacy["services"]["chat"]["version"] == 1
          assert fixture["services"]["chat"]["version"] == 2
          PY
          ulimit -l 8192
          test "$(ulimit -Hl)" = 8192
          test "$(ulimit -Sl)" = 8192
          printf 'soft=%s KiB hard=%s KiB\n' "$(ulimit -Sl)" "$(ulimit -Hl)" > out/memlock.txt
          rc=0
          for consumer in gufo extension; do
            runtime="$WORK/tested/embed/$consumer"
            cc -D_GNU_SOURCE -I "$runtime" "$GITHUB_WORKSPACE/.github/sdk030-abi-retry/controller-abi.c" \
              -L "$runtime" -Wl,-rpath,"$runtime" -lloom_text_embed -o "$WORK/$consumer-abi"
            if [ "$consumer" = extension ]; then
              chmod +x "$runtime/logits-probe"
              LD_LIBRARY_PATH="$runtime" timeout 180s "$runtime/logits-probe" "$WORK/legacy" 6 2 chat \
                | tee out/extension-legacy.json || rc=1
            fi
            timeout 120s "$WORK/$consumer-abi" "$WORK/abi2" default tiny \
              2>&1 | tee "out/$consumer-abi2.txt" || rc=1
          done
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always() && env.WORK != ''
        with:
          name: sdk030-controller-abi-retry
          path: ${{ env.WORK }}/out
      - name: Remove isolated workspace
        if: always() && env.WORK != ''
        shell: bash
        run: |
          case "$WORK" in "$RUNNER_TEMP"/sdk030-controller-retry.*) rm -rf -- "$WORK";; *) exit 1;; esac

name: devlab-gap
# Probe for the local-vs-DevLab Loom performance gap (not for merge): sysdump + Loom prefill probe + device profile.
on:
  pull_request:
    types: [labeled, synchronize]
permissions:
  contents: read
concurrency:
  group: devlab-gap-${{ github.ref }}
  cancel-in-progress: true
jobs:
  probe:
    if: contains(github.event.pull_request.labels.*.name, 'devlab-gap')
    strategy:
      fail-fast: false
      matrix:
        idx: [1, 2, 3]
    name: probe-${{ matrix.idx }}
    runs-on: [strix-halo, devlab-dispatch, Linux, self-hosted]
    timeout-minutes: 90
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      LLAMACPP: b1368
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: work dir
        run: mkdir -p "$GITHUB_WORKSPACE/../devlab-gap-work" && echo "WORK=$(cd "$GITHUB_WORKSPACE/../devlab-gap-work" && pwd)" >> "$GITHUB_ENV" && rm -rf "$GITHUB_WORKSPACE/../devlab-gap-work/out"
      - name: probe
        run: bash .github/devlab-gap/job.sh
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gap-${{ matrix.idx }}
          path: ${{ env.WORK }}/out
          retention-days: 14

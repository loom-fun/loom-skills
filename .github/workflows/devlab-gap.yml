name: devlab-gap
# Probe for the local-vs-DevLab Loom performance gap (not for merge): sysdump + Loom prefill probe + device profile.
on:
  pull_request:
    types: [labeled, synchronize]
permissions:
  contents: read
concurrency:
  group: devlab-gap-${{ github.ref }}
  cancel-in-progress: true
jobs:
  probe:
    if: contains(github.event.pull_request.labels.*.name, 'devlab-gap')
    strategy:
      fail-fast: false
      matrix:
        include:
          - {idx: laguna, mode: memory, card: loom-fun/ggml-org-Laguna-XS-2.1-loom}
          - {idx: qwen36-27b, mode: memory, card: loom-fun/ggml-org-Qwen3.6-27B-loom}
          - {idx: ornith-122b, mode: memory, card: loom-fun/bartowski-Ornith-1.5-122B-loom}
    name: probe-${{ matrix.idx }}
    runs-on: [strix-halo, devlab-dispatch, Linux, self-hosted]
    timeout-minutes: 150
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      LLAMACPP: b1368
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: work dir
        run: mkdir -p "$GITHUB_WORKSPACE/../devlab-gap-work" && echo "WORK=$(cd "$GITHUB_WORKSPACE/../devlab-gap-work" && pwd)" >> "$GITHUB_ENV" && rm -rf "$GITHUB_WORKSPACE/../devlab-gap-work/out"
      - name: probe
        run: bash .github/devlab-gap/job2.sh
        env:
          MODE: ${{ matrix.mode }}
          CARD: ${{ matrix.card }}
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gap-${{ matrix.idx }}
          path: ${{ env.WORK }}/out
          retention-days: 14

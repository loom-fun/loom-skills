name: DevLab downstream controller ABI checks
on:
  push:
    branches: [codex/sdk030-consumer-devlab]
    paths:
      - .github/workflows/sdk030-controller-abi.yml
      - .github/sdk030-consumer/controller-abi.*
permissions:
  contents: read
jobs:
  controller-abi:
    runs-on: [strix-halo, devlab-dispatch, Linux, self-hosted]
    timeout-minutes: 45
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '8'
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare isolated runner workspace
        shell: bash
        run: |
          set -euo pipefail
          work=$(mktemp -d "$RUNNER_TEMP/sdk030-controller-abi.XXXXXX")
          echo "WORK=$work" >> "$GITHUB_ENV"
          mkdir "$work/out"
      - name: Check actual legacy and current controller programs in both Gufo embedding libraries
        shell: bash
        run: bash .github/sdk030-consumer/controller-abi.sh
      - uses: actions/upload-artifact@v4
        if: always() && env.WORK != ''
        with:
          name: sdk030-controller-abi
          path: ${{ env.WORK }}/out
      - name: Remove isolated workspace
        if: always() && env.WORK != ''
        shell: bash
        run: |
          case "$WORK" in "$RUNNER_TEMP"/sdk030-controller-abi.*) rm -rf -- "$WORK";; *) exit 1;; esac

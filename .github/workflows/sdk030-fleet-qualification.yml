name: SDK 0.3 fleet confirmation
on:
  pull_request:
    types: [labeled]
permissions:
  actions: read
  contents: read
jobs:
  verify:
    if: github.head_ref == 'codex/sdk030-fleet-qualification' && github.event.label.name == 'devlab-experiment'
    name: ${{ matrix.device }} ${{ matrix.slug }}
    strategy:
      max-parallel: 6
      fail-fast: false
      matrix:
        include:
          - slug: unsloth-Qwen3.5-4B-loom
            device: radeon-r9700
            labels: '["self-hosted","devlab-dispatch","radeon-r9700"]'
            pinned_programs: '6a47f53f1466bb7cad142b6b2874ccf9c5ee8b96aa77490155252e5d8d7c8f62'
    runs-on: ${{ fromJSON(matrix.labels) }}
    timeout-minutes: 240
    env:
      SLUG: ${{ matrix.slug }}
      SDK_GPU_KEY: ${{ matrix.device }}
      GH_TOKEN: ${{ github.token }}
      INITIAL_CORRECTNESS: ${{ matrix.correctness }}
      DISPATCH_HEAD: ${{ github.event.pull_request.head.sha }}
      ABBA_REPS: ${{ matrix.reps }}
      PINNED_PROGRAMS: ${{ matrix.pinned_programs }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3adfe7b7b6e68f753042e9f89b318e29a6088579
          fetch-depth: 0
          persist-credentials: false
      - name: Plan from the accepted production revision
        shell: bash
        run: |
          set -euo pipefail
          export WORK="$(dirname "$GITHUB_WORKSPACE")/sdk030-wave-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$SDK_GPU_KEY-$SLUG"
          mkdir -p "$WORK/receipt"
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          python3 fleet/regen.py plan --base codex/sdk030-migration --mode sdk-loom --new-sdk 0.3.0 --gates full --device "$SDK_GPU_KEY" --batch 1 --work "$WORK/plan" --state "$WORK/receipt/state.json" "$SLUG"
          repetitions=()
          if [ -n "$ABBA_REPS" ]; then
            [ "$ABBA_REPS" = 6 ]
            repetitions=(--reps "$ABBA_REPS")
          fi
          python3 .github/scripts/ab_jobs.py --device "$SDK_GPU_KEY" --gates full --sdk-ab --old-sdk card --new-sdk 0.3.0 --refs "$WORK/plan/refs_$SDK_GPU_KEY.json" "${repetitions[@]}" "$SLUG" > "$WORK/receipt/experiment.json"
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json,os
          from pathlib import Path
          work=Path(os.environ['WORK'])
          plan=json.loads((work/'receipt/experiment.json').read_text())
          frozen=json.loads(Path('skills/loom-migrate/versions/v0.2.0-to-v0.3.0-production.json').read_text())
          job,=plan['jobs']
          repo='loom-fun/'+os.environ['SLUG']
          assert job['card']==repo+'@'+frozen[repo],job['card']
          assert job.get('sdk',plan.get('sdk'))=='0.3.0'
          variants={v['name']:v for v in job['variants']}
          assert variants['fun']['sdk']=='card' and variants['fun']['card']==job['card']
          assert variants['staging']['sdk']=='0.3.0' and 'card' not in variants['staging']
          if os.environ['PINNED_PROGRAMS']:
              for name in ('staging','stagingnd'):
                  variant=variants[name]
                  assert variant['sdk']=='0.3.0'
                  variant.pop('build')
                  variant.pop('build_args',None)
                  variant['card']=job['card']
              (work/'receipt/experiment.json').write_text(json.dumps(plan))
          print('JOB='+job['name'])
          PY
      - name: Verify eligibility for reusing original correctness
        if: env.INITIAL_CORRECTNESS != ''
        shell: bash
        run: |
          set -euo pipefail
          if ! git show "$DISPATCH_HEAD:.github/scripts/sdk030_confirm_reuse.py" > "$WORK/sdk030_confirm_reuse.py"; then
            echo 'The launch-proof helper was unavailable; running full qualification.' > "$WORK/receipt/correctness-fallback.log"
            exit 0
          fi
          python3 "$WORK/sdk030_confirm_reuse.py" prepare "$WORK" "$INITIAL_CORRECTNESS" "$GITHUB_WORKSPACE"
      - name: Build, serve and measure the release candidate
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$WORK/reuse-plan.json" ]; then
            start=$SECONDS
            if SDK030_LAUNCH_PROOF="$WORK/sdk030_confirm_reuse.py" bash .github/scripts/sdk030_record_perf.sh "$WORK/receipt/experiment.json" "$JOB" \
                && python3 "$WORK/sdk030_confirm_reuse.py" validate "$WORK" "$WORK/$JOB" "$((SECONDS - start))" > "$WORK/reuse-validation.log" 2>&1; then
              exit 0
            fi
            if [ -e "$WORK/reuse-validation.log" ]; then
              cp "$WORK/reuse-validation.log" "$WORK/receipt/correctness-fallback.log"
            else
              echo 'The shortened DevLab run failed; repeating full qualification.' > "$WORK/receipt/correctness-fallback.log"
            fi
            cp "$WORK/full-experiment.json" "$WORK/receipt/experiment.json"
          fi
          bash .github/scripts/devlab_perf.sh "$WORK/receipt/experiment.json" "$JOB"
      - name: Save the measured package and identity
        if: always() && env.JOB != ''
        shell: bash
        run: |
          set -euo pipefail
          d="$WORK/$JOB"
          cp -r "$d/out" "$WORK/receipt/"
          if [ -e "$d/staging/pkg/model.json" ]; then
            tar -C "$d/staging/pkg" --exclude=parameter --exclude='*.gguf' --exclude='*.safetensors' --exclude='bench' -czf "$WORK/receipt/package-without-weights.tar.gz" .
          fi
      - name: Require complete test and performance records
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,os
          receipt=Path(os.environ['WORK'])/'receipt'
          out=receipt/'out'
          results=json.loads((out/'summary.json').read_text())['results']
          failures={k:v for k,v in results.items() if not v or 'FAIL' in str(v) or 'ERROR' in str(v)}
          rows=[json.loads(line) for line in (out/'perf_staging.jsonl').read_text().splitlines()] if (out/'perf_staging.jsonl').is_file() else []
          if not any(r.get('decode_tps') for r in rows) or not any(r.get('prefill_long') for r in rows):
              failures['performance']='missing short or long metrics'
          common=('c4:funnd', 'c4:stagingnd', 'perf:fun:1', 'perf:fun:1:long', 'textmatch:fun', 'textmatch:staging')
          correctness=('smoke:fun', 'smoke:staging') if (receipt/'correctness-reused.json').is_file() else ('func:staging', 'ktest:staging', 'gates:staging:full')
          for step in common + correctness:
              if step not in results:
                  failures[step]='missing required result'
          if digest:=os.environ['PINNED_PROGRAMS']:
              for variant in ('fun','funnd','staging','stagingnd'):
                  if (out/f'programs_sha256_{variant}.txt').read_text().strip()!=digest:
                      failures[variant]='different programs from the frozen package'
          if not results or failures:raise SystemExit(str(failures or 'no results'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdk030-${{ matrix.device }}-${{ matrix.slug }}
          path: ${{ env.WORK }}/receipt
          retention-days: 30
      - name: Release job disk
        if: always()
        shell: bash
        run: |
          if [ -f "$WORK/reuse-plan.json" ]; then rm -f .github/scripts/sdk030_record_perf.sh; fi
          if [ "${WORK:-}" = "$(dirname "$GITHUB_WORKSPACE")/sdk030-wave-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$SDK_GPU_KEY-$SLUG" ]; then rm -rf -- "$WORK"; fi

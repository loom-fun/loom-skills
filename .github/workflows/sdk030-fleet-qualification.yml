name: SDK 0.3 Radeon queued fleet remainder
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  verify:
    if: github.head_ref == 'codex/sdk030-fleet-qualification' && github.event.label.name == 'devlab-experiment'
    name: ${{ matrix.device }} ${{ matrix.slug }}
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        include:
          - slug: ggml-org-LFM2.5-24B-A2B-loom
            device: radeon-r9700
            labels: '["self-hosted","devlab-dispatch","radeon-r9700"]'
          - slug: rippertnt-HyperCLOVAX-SEED-Text-Instruct-1.5B-loom
            device: radeon-r9700
            labels: '["self-hosted","devlab-dispatch","radeon-r9700"]'
          - slug: ggml-org-Qwen3-4B-loom
            device: radeon-r9700
            labels: '["self-hosted","devlab-dispatch","radeon-r9700"]'
          - slug: bartowski-Mellum2.1-12B-A2.5B-Thinking-loom
            device: radeon-r9700
            labels: '["self-hosted","devlab-dispatch","radeon-r9700"]'
          - slug: unsloth-Qwen3.5-4B-loom
            device: radeon-r9700
            labels: '["self-hosted","devlab-dispatch","radeon-r9700"]'
          - slug: unsloth-gpt-oss-20b-loom
            device: radeon-r9700
            labels: '["self-hosted","devlab-dispatch","radeon-r9700"]'
          - slug: unsloth-Llama-3.2-3B-Instruct-loom
            device: radeon-r9700
            labels: '["self-hosted","devlab-dispatch","radeon-r9700"]'
          - slug: unsloth-Qwen3-8B-loom
            device: radeon-r9700
            labels: '["self-hosted","devlab-dispatch","radeon-r9700"]'
          - slug: ggml-org-Qwen3-14B-loom
            device: radeon-r9700
            labels: '["self-hosted","devlab-dispatch","radeon-r9700"]'
          - slug: unsloth-gemma-4-E4B-it-loom
            device: radeon-r9700
            labels: '["self-hosted","devlab-dispatch","radeon-r9700"]'
          - slug: bartowski-Ornith-1.5-9B-loom
            device: radeon-r9700
            labels: '["self-hosted","devlab-dispatch","radeon-r9700"]'
          - slug: unsloth-Qwen3.5-9B-loom
            device: radeon-r9700
            labels: '["self-hosted","devlab-dispatch","radeon-r9700"]'
          - slug: bartowski-MiniCPM-V-4.7-35B-A3B-loom
            device: radeon-r9700
            labels: '["self-hosted","devlab-dispatch","radeon-r9700"]'
          - slug: lmstudio-community-Ornith-1.0-35B-loom
            device: radeon-r9700
            labels: '["self-hosted","devlab-dispatch","radeon-r9700"]'
          - slug: nvidia-NVIDIA-Nemotron-3.5-Bolt-E4B-4GB-loom
            device: radeon-r9700
            labels: '["self-hosted","devlab-dispatch","radeon-r9700"]'
          - slug: bartowski-Qwen2.5-32B-Instruct-loom
            device: radeon-r9700
            labels: '["self-hosted","devlab-dispatch","radeon-r9700"]'
          - slug: bartowski-Qwen3.8-27B-loom
            device: radeon-r9700
            labels: '["self-hosted","devlab-dispatch","radeon-r9700"]'
          - slug: XHToken-Spark-X2.5-4B-loom
            device: radeon-r9700
            labels: '["self-hosted","devlab-dispatch","radeon-r9700"]'
          - slug: bartowski-Spark-X2.6-4B-loom
            device: radeon-r9700
            labels: '["self-hosted","devlab-dispatch","radeon-r9700"]'
          - slug: unsloth-Qwen3-4B-Instruct-2507-loom

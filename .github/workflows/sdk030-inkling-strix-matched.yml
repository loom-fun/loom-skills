name: Strix Inkling frozen full qualification with matched reference
on:
  push:
    branches: [codex/sdk030-special-qualification]
    paths: [.github/workflows/sdk030-inkling-strix-matched.yml]
permissions:
  contents: read
jobs:
  verify:
    name: ${{ matrix.device }} ${{ matrix.slug }}
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        include:
          - slug: unsloth-Inkling-2-Mini-loom
            device: strix-halo
            labels: '["self-hosted","devlab-dispatch","strix-halo","Linux"]'
    runs-on: ${{ fromJSON(matrix.labels) }}
    timeout-minutes: 240
    env:
      SLUG: ${{ matrix.slug }}
      SDK_GPU_KEY: ${{ matrix.device }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2b78eebf5c93b8b1d92d86d0fbe20275c674cde2
          fetch-depth: 0
          persist-credentials: false
      - name: Plan from the accepted production revision
        shell: bash
        run: |
          set -euo pipefail
          export WORK="$(dirname "$GITHUB_WORKSPACE")/sdk030-wave-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$SDK_GPU_KEY-$SLUG"
          mkdir -p "$WORK/receipt"
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, os
          from pathlib import Path
          slug = os.environ['SLUG']
          repo='loom-fun-staging/'+slug
          job=dict(name='special', card=repo+'@bd021e649b158e608b389eca9bfed60a0ec2d225', sdk='0.3.0',
                   llamacpp='b1384', reference_cache='none', variants=[dict(name='staging',sdk='0.3.0')],
                   steps=['func:staging','gates:staging:full'])
          plan=dict(runner='strix',memory_bytes=33000000000,jobs=[job])
          out=Path(os.environ['WORK'])/'receipt'
          (out/'experiment.json').write_text(json.dumps(plan,indent=2))
          h=Path('.github/scripts/devlab_perf.sh')
          import base64
          kit=Path(os.environ['WORK'])/'inkling-strix-kit'
          kit.mkdir()
          (kit/'chat_probe.py').write_bytes(base64.b64decode(''))
          source=h.read_text()
          line='export LOOM_KIT=${KIT[$p1]}'
          assert source.count(line)==1
          source=source.replace(line,'export LOOM_KIT="$WORK/inkling-strix-kit"')
          fetch=Path('skills/loom-benchmark/scripts/fetch_llamacpp.sh')
          text=fetch.read_text()
          anchor='  if [ "$backend" = vulkan ]; then   # pinned archive: refuse any other bytes'
          assert text.count(anchor)==1
          pin='''  if [ "$backend" = rocm ] && [ "$rtag" = b1384 ]; then
              [ "${url##*/}" = llama-b1384-ubuntu-rocm-gfx1151-x64.zip ] || exit 1
              echo "a838b224d2e12039158c4b44931d8311b47bc6c3e8557674adcc22f9433a0943  $dir/release.zip" | sha256sum -c >&2 || exit 1
              echo a838b224d2e12039158c4b44931d8311b47bc6c3e8557674adcc22f9433a0943 > "$dir/release.sha256"
            fi'''
          fetch.write_text(text.replace(anchor,pin+'\n'+anchor))
          ref_anchor='safetensors=$("$T" -c '
          assert source.count(ref_anchor)==1
          source=source.replace(ref_anchor,'gguf="$WORK/inkling-e6427665-mainline.gguf"\n'+ref_anchor)
          anchor='    ln -sfn "$vcard/parameter" "$pkg/parameter"'
          assert source.count(anchor)==1
          h.write_text(source.replace(anchor,'    rsync -a --exclude=/parameter --exclude=/.git "$vcard/" "$pkg/"\n'+anchor))
          print('JOB=special')
          PY
      - name: Verify deferred spec references fail closed and all get queued
        shell: bash
        run: |
          set -euo pipefail
          script=skills/loom-benchmark/scripts/spec_check.py
          python3 -m unittest discover -s tests -p test_spec_check.py -v |& tee "$WORK/receipt/spec-fixtures-fixed.log"
          cp "$script" "$WORK/spec-check-fixed.py"
          git show 16261e288ef75481d93ebb1a32bf5332f1a35751:"$script" > "$script"
          rc=0
          python3 -m unittest discover -s tests -p test_spec_check.py -v > "$WORK/receipt/spec-fixtures-original.log" 2>&1 || rc=$?
          cp "$WORK/spec-check-fixed.py" "$script"
          test "$rc" = 1
          grep -q 'IndexError: list index out of range' "$WORK/receipt/spec-fixtures-original.log"
          sha256sum "$script" tests/test_spec_check.py skills/loom-benchmark/scripts/ctx_admit.py > "$WORK/receipt/benchmark-source.sha256"
      - name: Fetch and verify the publisher's compatible reference at the same checkpoint revision
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 'https://huggingface.co/unsloth/Inkling-2-Mini-GGUF/resolve/ea0c79b2ecd73669e774c8519b79bfabfddbc027/Mainline_Support/Inkling-2-Mini-UD-Q4_K_XL.gguf_file' -o "$WORK/inkling-e6427665-mainline.gguf"
          echo "e64276656f072e9b2197a61723667cbdb71da66a716ffd966e572c21088f3cd3  $WORK/inkling-e6427665-mainline.gguf" | sha256sum -c | tee "$WORK/receipt/reference-sha256.log"
      - name: Build, serve and measure the release candidate
        run: bash .github/scripts/devlab_perf.sh "$WORK/receipt/experiment.json" "$JOB"
      - name: Save the measured package and identity
        if: always() && env.JOB != ''
        shell: bash
        run: |
          set -euo pipefail
          d="$WORK/$JOB"
          cp -r "$d/out" "$WORK/receipt/"
          cp "$WORK/llamacpp/b1384/release.sha256" "$WORK/receipt/reference-release.sha256"
          for file in spec_target.jsonl spec_draft.jsonl compare.json agent_golden.json agent_think_off.json; do
            path="$d/staging/bench/$file"
            if [ -f "$path" ]; then cp "$path" "$WORK/receipt/"; fi
          done
          if [ -e "$d/staging/pkg/model.json" ]; then
            tar -C "$d/staging/pkg" --exclude=parameter --exclude='*.gguf' --exclude='*.safetensors' --exclude='bench' -czf "$WORK/receipt/package-without-weights.tar.gz" .
          fi
      - name: Require pinned program and report the full verdict
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, os
          packet=Path(os.environ['WORK'])/'receipt'
          out=packet/'out'
          assert (packet/'reference-release.sha256').read_text().strip()=='a838b224d2e12039158c4b44931d8311b47bc6c3e8557674adcc22f9433a0943'
          assert (out/'programs_sha256_staging.txt').read_text().strip()=='fdb1aaa4771f05a9cc9315aa774bddf121123c8143d3b81762563e6fedc0f6aa'
          report=json.loads((out/'gates_staging/gates.json').read_text())
          assert report['level']=='full' and report['verdict']=='PASS', report
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdk030-inkling-strix-matched
          path: ${{ env.WORK }}/receipt
          retention-days: 30
      - name: Release job disk
        if: always()
        shell: bash
        run: |
          if [ "${WORK:-}" = "$(dirname "$GITHUB_WORKSPACE")/sdk030-wave-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$SDK_GPU_KEY-$SLUG" ]; then rm -rf -- "$WORK"; fi




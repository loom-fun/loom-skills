name: check-examples

# Every reference port is the starter plus a patch: keep the patches applying to the current starter.
on:
  pull_request:
    paths: ["skills/loom-port-llm/**"]
  push:
    branches: [main]
    paths: ["skills/loom-port-llm/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reference examples apply and compile
        run: skills/loom-port-llm/reference/check_examples.sh
      - name: Tokenizer rewrites self-check
        run: python3 skills/loom-port-llm/starter/runtime_tokenizer.py

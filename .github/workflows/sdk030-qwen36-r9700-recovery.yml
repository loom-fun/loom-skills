name: DevLab Qwen3.6 35B Radeon attention ablation
on:
  push:
    branches: [codex/sdk030-qwen36-r9700-recovery]
    paths: [.github/workflows/sdk030-qwen36-r9700-recovery.yml, .github/sdk030-qwen36/**]
permissions:
  contents: read
jobs:
  qwen36:
    runs-on: [self-hosted, devlab-dispatch, radeon-r9700]
    timeout-minutes: 125
    env:
      SLUG: ggml-org-Qwen3.6-35B-A3B-loom
      SDK_GPU_KEY: radeon-r9700
      POWER_LOG: '1'
      LOOM_PROFILE_TOKENS: '128'
      LOOM_PROFILE_PROCESS_IO: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare frozen and generated variants
        shell: bash
        run: |
          set -euo pipefail
          work=$(mktemp -d "$(dirname "$GITHUB_WORKSPACE")/sdk030-qwen36.XXXXXX")
          export WORK="$work"
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          mkdir -p "$WORK/receipt"
          python3 fleet/regen.py plan --base codex/sdk030-migration --mode sdk-loom --new-sdk 0.3.0 --gates full --device "$SDK_GPU_KEY" --batch 1 --work "$WORK/plan" --state "$WORK/receipt/state.json" "$SLUG"
          python3 .github/scripts/ab_jobs.py --device "$SDK_GPU_KEY" --gates full --sdk-ab --old-sdk card --new-sdk 0.3.0 --refs "$WORK/plan/refs_$SDK_GPU_KEY.json" "$SLUG" > "$WORK/receipt/experiment.json"
          python3 - <<'PY' >> "$GITHUB_ENV"
          import copy
          import json
          import os
          from pathlib import Path

          path = Path(os.environ['WORK']) / 'receipt/experiment.json'
          plan = json.loads(path.read_text())
          job, = plan['jobs']
          assert job['card'] == 'loom-fun/ggml-org-Qwen3.6-35B-A3B-loom@9a06cc9ba5ca93e2de3a5fa40b2ad4e415d191fe'
          by_name = {variant['name']: variant for variant in job['variants']}
          assert by_name['fun']['sdk'] == 'card' and by_name['fun']['card'] == job['card']
          assert by_name['staging']['sdk'] == '0.3.0' and 'card' not in by_name['staging']
          pinnd = copy.deepcopy(by_name['funnd'])
          pinnd.update(name='pinnd', sdk='0.3.0')
          split = copy.deepcopy(by_name['staging'])
          split.update(name='split', config={'choices': {'decode.attn.kv_once.d256': False}})
          job['variants'] = [by_name[name] for name in ('fun', 'staging', 'funnd')] + [split, pinnd]
          blocks = [('fun', 'staging', 'split'), ('split', 'fun', 'staging'), ('staging', 'split', 'fun')]
          job['steps'] = [f'qwen36decode:{arm}:{index}' for index, block in enumerate(blocks) for arm in block]
          job['steps'] += ['profile:funnd:dec32', 'profile:pinnd:dec32', 'func:split', 'ktest:split', 'gates:split:full']
          path.write_text(json.dumps(plan, indent=2) + '\n')
          print('JOB=' + job['name'])
          PY
      - name: Build the generated variant and run the Radeon comparisons
        run: bash .github/scripts/devlab_perf.sh "$WORK/receipt/experiment.json" "$JOB"
      - name: Save the measured source package and evidence
        if: always() && env.JOB != ''
        shell: bash
        run: |
          set -euo pipefail
          d="$WORK/$JOB"
          cp -r "$d/out" "$WORK/receipt/"
          if [ -f "$d/split/pkg/model.json" ]; then
            tar -C "$d/split/pkg" --exclude=parameter --exclude='*.gguf' --exclude='*.safetensors' --exclude=bench -czf "$WORK/receipt/split-control-without-weights.tar.gz" .
          fi
      - name: Verify the exact variant identities and completed comparisons
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from statistics import median

          out = Path(os.environ['WORK']) / 'receipt/out'
          old = (out / 'programs_sha256_fun.txt').read_text().strip()
          new = (out / 'programs_sha256_staging.txt').read_text().strip()
          pin = (out / 'programs_sha256_pinnd.txt').read_text().strip()
          split = (out / 'programs_sha256_split.txt').read_text().strip()
          expected_old = '014ae6cd00d911b8c6e2c984661ed0b390aa78185fae433c502bd36ee1157951'
          expected_new = 'fbf1f430ca8e42a28ee0e85f9f8246d45dc89e22a5e90308376b9da8b4bd3a2c'
          assert old == pin == expected_old and new == expected_new and split not in (old, new), (old, new, pin, split)
          sdk_versions = [json.loads((out / f'sdk_{arm}.json').read_text())['hrx_loom']
                          for arm in ('fun', 'pinnd', 'staging', 'split')]
          assert sdk_versions == ['0.2.0', '0.3.0', '0.3.0', '0.3.0']
          results = json.loads((out / 'summary.json').read_text())['results']
          summary = {}
          for arm in ('fun', 'staging', 'split'):
              captures = [json.loads((out / f'matched_{arm}-{i}.json').read_text()) for i in range(3)]
              summary[arm] = {context: [median(sample[context]['decode_tps'] for sample in capture['samples'])
                                        for capture in captures] for context in ('2k', '32k')}
              for capture in captures:
                  control = json.loads((out / f"matched_fun-{capture['session']}.json").read_text())
                  for current, baseline in zip(capture['samples'], control['samples'], strict=True):
                      for context in ('2k', '32k'):
                          assert current[context]['prompt_sha256'] == baseline[context]['prompt_sha256']
          summary['functions_and_gates'] = {key: results.get(key) for key in ('func:split', 'ktest:split', 'gates:split:full')}
          summary['profiles'] = {arm: (out / f'profile_{arm}_dec32.json').is_file() for arm in ('funnd', 'pinnd')}
          (out / 'recovery-summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(summary)
          PY
      - uses: actions/upload-artifact@v4
        if: always() && env.WORK != ''
        with:
          name: sdk030-qwen36-r9700-attention-ablation
          path: ${{ env.WORK }}/receipt
          if-no-files-found: error
          retention-days: 30
      - name: Release job disk
        if: always() && env.WORK != ''
        shell: bash
        run: |
          case "$WORK" in
            "$(dirname "$GITHUB_WORKSPACE")"/sdk030-qwen36.*) rm -rf -- "$WORK" ;;
            *) exit 1 ;;
          esac

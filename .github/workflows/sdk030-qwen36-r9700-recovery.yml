name: DevLab Qwen3.6 35B attention fix qualification
on:
  push:
    branches: [codex/sdk030-qwen36-r9700-recovery]
    paths: [.github/workflows/sdk030-qwen36-r9700-recovery.yml, .github/sdk030-qwen36/**]
permissions:
  contents: read
jobs:
  qwen36:
    name: ${{ matrix.device }} Qwen3.6 35B
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: radeon-r9700
            labels: '["self-hosted","devlab-dispatch","radeon-r9700"]'
          - device: strix-halo
            labels: '["self-hosted","devlab-dispatch","strix-halo","Linux"]'
    runs-on: ${{ fromJSON(matrix.labels) }}
    timeout-minutes: 180
    env:
      SLUG: ggml-org-Qwen3.6-35B-A3B-loom
      SDK_GPU_KEY: ${{ matrix.device }}
      POWER_LOG: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare frozen and generated variants
        shell: bash
        run: |
          set -euo pipefail
          work=$(mktemp -d "$(dirname "$GITHUB_WORKSPACE")/sdk030-qwen36.XXXXXX")
          export WORK="$work"
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          mkdir -p "$WORK/receipt"
          git rev-parse HEAD > "$WORK/receipt/generator-revision.txt"
          python3 skills/loom-kb/kb.py lint
          python3 fleet/regen.py plan --base codex/sdk030-migration --mode sdk-loom --new-sdk 0.3.0 --gates full --device "$SDK_GPU_KEY" --batch 1 --work "$WORK/plan" --state "$WORK/receipt/state.json" "$SLUG"
          python3 .github/scripts/ab_jobs.py --device "$SDK_GPU_KEY" --reps 6 --gates full --sdk-ab --old-sdk card --new-sdk 0.3.0 --refs "$WORK/plan/refs_$SDK_GPU_KEY.json" "$SLUG" > "$WORK/receipt/experiment.json"
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          import os
          from pathlib import Path

          path = Path(os.environ['WORK']) / 'receipt/experiment.json'
          plan = json.loads(path.read_text())
          job, = plan['jobs']
          assert job['card'] == 'loom-fun/ggml-org-Qwen3.6-35B-A3B-loom@9a06cc9ba5ca93e2de3a5fa40b2ad4e415d191fe'
          by_name = {variant['name']: variant for variant in job['variants']}
          assert by_name['fun']['sdk'] == 'card' and by_name['fun']['card'] == job['card']
          assert by_name['staging']['sdk'] == '0.3.0' and 'card' not in by_name['staging']
          assert not by_name['staging'].get('config'), by_name['staging']
          print('JOB=' + job['name'])
          PY
      - name: Build the repaired variant and run the device comparison
        run: bash .github/scripts/devlab_perf.sh "$WORK/receipt/experiment.json" "$JOB"
      - name: Save the measured source package and evidence
        if: always() && env.JOB != ''
        shell: bash
        run: |
          set -euo pipefail
          d="$WORK/$JOB"
          cp -r "$d/out" "$WORK/receipt/"
          if [ -f "$d/staging/pkg/model.json" ]; then
            tar -C "$d/staging/pkg" --exclude=parameter --exclude='*.gguf' --exclude='*.safetensors' --exclude=bench -czf "$WORK/receipt/package-without-weights.tar.gz" .
          fi
      - name: Verify the exact variant identities and completed comparisons
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/strix_ab_compare.py "$WORK/receipt/out" --fun-info "$WORK/receipt/out/info_card.json" --gpu "$SDK_GPU_KEY" --json "$WORK/receipt/comparison.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = Path(os.environ['WORK']) / 'receipt'
          out = receipt / 'out'
          old = (out / 'programs_sha256_fun.txt').read_text().strip()
          new = (out / 'programs_sha256_staging.txt').read_text().strip()
          expected_old = '014ae6cd00d911b8c6e2c984661ed0b390aa78185fae433c502bd36ee1157951'
          expected_new = '367fe64b24bd638729d365c201eeb3e16cb5b099561d764dcfed7138fa9569f6'
          assert old == expected_old and new == expected_new, (old, new)
          sdk_versions = [json.loads((out / f'sdk_{arm}.json').read_text())['hrx_loom']
                          for arm in ('fun', 'staging')]
          assert sdk_versions == ['0.2.0', '0.3.0']
          comparison = json.loads((receipt / 'comparison.json').read_text())
          assert len(comparison['metrics']) == 9
          assert not comparison['degraded_runner'], comparison['degraded_runner']
          assert set(comparison['gate_status'].values()) == {'PASS'}, comparison['gate_status']
          assert comparison['text']['status'] == 'MATCH', comparison['text']
          failures = {name: row for name, row in comparison['metrics'].items() if row['status'] != 'PASS'}
          assert not failures, failures
          PY
      - name: Verify the full fleet program impact of the scoped rule
        if: always() && env.WORK != '' && matrix.device == 'radeon-r9700'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$WORK/scope-tools"
          "$WORK/scope-tools/bin/pip" -q install gguf numpy jinja2 pyyaml
          "$WORK/scope-tools/bin/python" fleet/scope_lint.py \
            --base ed6c623eb457137123f2dfe55454b8943ab17a08 \
            --head b4347a68799c83ddb7f44cc5345d9f9da692a687 \
            --local --work "$WORK/scope-impact" \
            --json "$WORK/receipt/scope-lint.json" --md "$WORK/receipt/scope-lint.md" \
            --scope-block 'kind: targeted
          scopes: model/ggml-org-Qwen3.6-35B-A3B-loom, arch/llm/moe/qwen35moe, device/rdna4'
      - uses: actions/upload-artifact@v4
        if: always() && env.WORK != ''
        with:
          name: sdk030-${{ matrix.device }}-ggml-org-Qwen3.6-35B-A3B-loom-repaired
          path: ${{ env.WORK }}/receipt
          if-no-files-found: error
          retention-days: 30
      - name: Release job disk
        if: always() && env.WORK != ''
        shell: bash
        run: |
          case "$WORK" in
            "$(dirname "$GITHUB_WORKSPACE")"/sdk030-qwen36.*) rm -rf -- "$WORK" ;;
            *) exit 1 ;;
          esac

name: DevLab Loom 0.3.0 downstream
on:
  push:
    branches: [codex/sdk030-consumer-devlab]
    paths: [.github/workflows/sdk030-consumer-devlab.yml, .github/sdk030-consumer/**]
permissions:
  contents: read
concurrency:
  group: sdk030-consumer-devlab
  cancel-in-progress: false
jobs:
  consumers:
    runs-on: [strix-halo, devlab-dispatch, Linux, self-hosted]
    timeout-minutes: 50
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '8'
      SDK030_GPU_SMOKE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare isolated workspace
        shell: bash
        run: |
          set -euo pipefail
          work=$(mktemp -d "$RUNNER_TEMP/sdk030-consumers.XXXXXX")
          echo "WORK=$work" >> "$GITHUB_ENV"
          mkdir "$work/out"
      - name: Prepare Gufo and the extension and build the embed runtime
        shell: bash
        run: bash .github/sdk030-consumer/gufo.sh
      - name: Build the refreshed Lemonade contract and server
        shell: bash
        run: bash .github/sdk030-consumer/lemonade.sh
      - name: Serve the pinned staging package through Lemonade and both Gufo embeds
        env:
          HF_TOKEN: '${{ secrets.HF_TOKEN }}'
        shell: bash
        run: bash .github/sdk030-consumer/smoke.sh
      - name: Store changes and lab evidence
        if: always() && env.WORK != ''
        uses: actions/upload-artifact@v4
        with:
          name: sdk030-consumer-evidence
          path: '${{ env.WORK }}/out'
          if-no-files-found: error
      - name: Remove isolated workspace
        if: always() && env.WORK != ''
        shell: bash
        run: |
          case "$WORK" in
            "$RUNNER_TEMP"/sdk030-consumers.*) rm -rf -- "$WORK" ;;
            *) exit 1 ;;
          esac

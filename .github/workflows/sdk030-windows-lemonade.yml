name: DevLab Windows Lemonade wheel upgrade and staged Flash
on:
  push:
    branches: [codex/sdk030-windows-perf-testing]
    paths: [.github/workflows/sdk030-windows-lemonade.yml]
permissions:
  contents: read
  actions: read
env:
  LEMONADE_REVISION: 891c067d787ad9d4c493c340651fbaf963a8f3e3
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
        working-directory: lemonade
    steps:
      - uses: actions/checkout@v4
        with:
          repository: lemonade-sdk/lemonade
          ref: ${{ env.LEMONADE_REVISION }}
          path: lemonade
          persist-credentials: false
      - name: Build and test exact Lemonade Windows draft
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD) -ne $env:LEMONADE_REVISION) { throw 'Lemonade revision mismatch' }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $preset = if ((& $vswhere -latest -property catalog_productLineVersion) -eq '18') { 'vs18' } else { 'windows' }
          cmake --preset $preset -DBUILD_WEB_APP=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --config Release --target test_loom_contract test_install_atomicity embeddable -- /m:2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build -C Release --output-on-failure --no-tests=error -R '^(LoomContractTest|InstallAtomicityTest)$'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archives = @(Get-ChildItem build -Filter 'lemonade-embeddable-*-windows-x64.zip' -File)
          if ($archives.Count -ne 1) { throw 'Expected one qualified embeddable ZIP' }
          $env:LEMONADE_REVISION | Set-Content 'build/draft-head.txt' -Encoding ascii
          (Get-FileHash $archives[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content 'build/draft-build-sha256.txt' -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: lemonade-windows-draft
          path: |
            lemonade/build/lemonade-embeddable-*-windows-x64.zip
            lemonade/build/draft-head.txt
            lemonade/build/draft-build-sha256.txt
  native:
    runs-on: [windows, strix-halo, devlab-dispatch]
    timeout-minutes: 115
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Materialize immutable test packages while the Windows build runs
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:GITHUB_WORKSPACE 'windows-lemonade-evidence'
          $scratch = Join-Path $env:RUNNER_TEMP "windows-sdk030-perf-lemonade-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $out,$scratch | Out-Null
          "WINPERF_SCRATCH=$scratch" >> $env:GITHUB_ENV
          [ordered]@{
            machine = $env:COMPUTERNAME
            os = Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,BuildNumber
            cpu = Get-CimInstance Win32_Processor | Select-Object Name
            gpu = Get-CimInstance Win32_VideoController | Select-Object Name,DriverVersion
          } | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $out 'machine.json') -Encoding UTF8
          python .github/sdk030-windows-perf/lemonade.py prepare "$scratch" "$out"
          if ($LASTEXITCODE -ne 0) { throw 'Could not prepare pinned test packages' }
      - name: Wait for the built same-run application artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $end = (Get-Date).AddMinutes(38)
          while ((Get-Date) -lt $end) {
            $artifacts = (Invoke-RestMethod "$api/artifacts" -Headers $headers -TimeoutSec 25).artifacts
            if ($artifacts | Where-Object { $_.name -eq 'lemonade-windows-draft' -and !$_.expired }) { exit 0 }
            $build = (Invoke-RestMethod "$api/jobs" -Headers $headers -TimeoutSec 25).jobs | Where-Object name -eq 'build'
            if ($build.status -eq 'completed' -and $build.conclusion -ne 'success') { throw 'The Windows build failed' }
            Start-Sleep -Seconds 25
          }
          throw 'The exact Windows application build did not upload before the timeout'
      - uses: actions/download-artifact@v4
        with:
          name: lemonade-windows-draft
          path: ${{ env.WINPERF_SCRATCH }}/draft
      - name: Upgrade an existing installation and serve both packages through Lemonade
        run: |
          $ErrorActionPreference = 'Stop'
          python .github/sdk030-windows-perf/lemonade.py run "$env:WINPERF_SCRATCH" "$env:GITHUB_WORKSPACE/windows-lemonade-evidence"
          if ($LASTEXITCODE -ne 0) { throw 'Native Lemonade proof failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lemonade-native-windows-proof
          path: windows-lemonade-evidence
          if-no-files-found: ignore
      - name: Clean isolated benchmark directory
        if: always() && env.WINPERF_SCRATCH != ''
        run: |
          $root = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\') + '\'
          $target = [IO.Path]::GetFullPath($env:WINPERF_SCRATCH)
          if (!$target.StartsWith($root, [StringComparison]::OrdinalIgnoreCase) -or
              !(Split-Path $target -Leaf).StartsWith('windows-sdk030-perf-lemonade-')) {
            throw 'Benchmark scratch path is outside the expected runner directory'
          }
          Remove-Item -LiteralPath $target -Recurse -Force

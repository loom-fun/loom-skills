name: SDK 0.3 materialization card golden proof
on:
  push:
    branches: [codex/sdk030-materialize-card-proof]
    paths: [.github/workflows/sdk030-materialize-card-proof.yml, .github/scripts/loom_factory.py, skills/loom-benchmark/scripts/card/test/check.sh]
permissions:
  contents: read
jobs:
  golden:
    runs-on: [Linux, devlab-dispatch, self-hosted]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify all exact card goldens and SDK 0.3 Quick starts
        run: |
          python3 -m py_compile skills/loom-benchmark/scripts/card/render_card.py .github/scripts/loom_factory.py
          bash skills/loom-benchmark/scripts/card/test/check.sh

name: SDK 0.3 materialization card golden proof
on:
  push:
    branches: [codex/sdk030-materialize-card-proof]
    paths: [.github/workflows/sdk030-materialize-card-proof.yml]
permissions:
  contents: read
jobs:
  golden:
    runs-on: [Linux, devlab-dispatch, self-hosted]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify all exact card goldens and SDK 0.3 Quick starts
        run: bash skills/loom-benchmark/scripts/card/test/check.sh

name: SDK 0.3 Strix Halo launch fleet
on:
  push:
    branches: [codex/sdk030-strix-launch-ab]
    paths: [.github/sdk030-launch/strix-fleet.json]

permissions:
  contents: read

jobs:
  compare:
    name: "${{ matrix.row.slug }} / ${{ matrix.row.preset }}"
    strategy:
      fail-fast: false
      matrix:
        row: ${{ fromJSON('[{"slug":"InternScience-Sage-A1.5-loom","preset":"chat"},{"slug":"XHToken-Spark-X2.5-4B-loom","preset":"chat"},{"slug":"bartowski-LFM3-1.7B-loom","preset":"chat"},{"slug":"bartowski-Mellum2.1-12B-A2.5B-Thinking-loom","preset":"chat"},{"slug":"bartowski-MiniCPM-V-4.7-35B-A3B-loom","preset":"chat"},{"slug":"bartowski-Nanbeige4.3-33B-loom","preset":"chat"},{"slug":"bartowski-Ornith-1.5-122B-loom","preset":"chat"},{"slug":"bartowski-Ornith-1.5-35B-A3B-loom","preset":"chat"},{"slug":"bartowski-Ornith-1.5-9B-loom","preset":"chat"},{"slug":"bartowski-Qwen2.5-1.5B-Instruct-loom","preset":"chat"},{"slug":"bartowski-Qwen2.5-32B-Instruct-loom","preset":"chat"},{"slug":"bartowski-Qwen2.5-7B-Instruct-loom","preset":"chat"},{"slug":"bartowski-Spark-X2.6-4B-loom","preset":"chat"},{"slug":"ggml-org-Flint-loom","preset":"chat"},{"slug":"ggml-org-LFM2.5-24B-A2B-loom","preset":"chat"},{"slug":"ggml-org-LFM3-Omni-2B-loom","preset":"chat"},{"slug":"ggml-org-Laguna-XS-2.1-loom","preset":"chat"},{"slug":"ggml-org-Muse-Glimmer-30B-loom","preset":"chat"},{"slug":"ggml-org-Qwen2.5-VL-7B-Instruct-loom","preset":"chat"},{"slug":"ggml-org-Qwen3-1.7B-loom","preset":"chat"},{"slug":"ggml-org-Qwen3-14B-loom","preset":"chat"},{"slug":"ggml-org-Qwen3-4B-loom","preset":"chat"},{"slug":"ggml-org-Qwen3-Coder-30B-A3B-Instruct-loom","preset":"chat"},{"slug":"ggml-org-Qwen3.6-27B-loom","preset":"chat"},{"slug":"ggml-org-Qwen3.6-35B-A3B-loom","preset":"chat"},{"slug":"ggml-org-gemma-3-1b-it-loom","preset":"chat"},{"slug":"jdopensource-JoyAI-LLM-Flash-loom","preset":"chat"},{"slug":"lmstudio-community-Ornith-1.0-35B-loom","preset":"chat"},{"slug":"lmstudio-community-gemma-4-26B-A4B-it-loom","preset":"chat"},{"slug":"nvidia-NVIDIA-Nemotron-3.5-Bolt-E4B-4GB-loom","preset":"chat"},{"slug":"rippertnt-HyperCLOVAX-SEED-Text-Instruct-1.5B-loom","preset":"chat"},{"slug":"unsloth-Inkling-2-Mini-loom","preset":"chat"},{"slug":"unsloth-Inkling-2-Mini-loom-r9700","preset":"chat"},{"slug":"unsloth-Llama-3.2-3B-Instruct-loom","preset":"chat"},{"slug":"unsloth-Ornith-1.0-9B-loom","preset":"chat"},{"slug":"unsloth-Qwen3-0.6B-loom","preset":"chat"},{"slug":"unsloth-Qwen3-30B-A3B-Instruct-2507-loom","preset":"chat"},{"slug":"unsloth-Qwen3-4B-Instruct-2507-loom","preset":"chat"},{"slug":"unsloth-Qwen3-8B-loom","preset":"chat"},{"slug":"unsloth-Qwen3-VL-4B-Instruct-loom","preset":"chat"},{"slug":"unsloth-Qwen3-VL-8B-Instruct-loom","preset":"chat"},{"slug":"unsloth-Qwen3.5-0.8B-loom","preset":"chat"},{"slug":"unsloth-Qwen3.5-2B-loom","preset":"chat"},{"slug":"unsloth-Qwen3.5-35B-A3B-loom","preset":"chat"},{"slug":"unsloth-Qwen3.5-4B-loom","preset":"chat"},{"slug":"unsloth-Qwen3.5-9B-loom","preset":"chat"},{"slug":"unsloth-Qwen3.8-27B-UD-Q4_K_XL","preset":"chat"},{"slug":"unsloth-gemma-4-12B-it-loom","preset":"chat"},{"slug":"unsloth-gemma-4-26B-A4B-it-qat-loom","preset":"chat"},{"slug":"unsloth-gemma-4-31B-it-loom","preset":"chat"},{"slug":"unsloth-gemma-4-31B-it-qat-loom","preset":"chat"},{"slug":"unsloth-gemma-4-E4B-it-loom","preset":"chat"},{"slug":"unsloth-gpt-oss-20b-loom","preset":"chat"}]') }}
    runs-on: [self-hosted, devlab-dispatch, strix-halo, Linux]
    timeout-minutes: 165
    env:
      PRESET: ${{ matrix.row.preset }}
      SLUG: ${{ matrix.row.slug }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify immutable stage and materialize the selected preset
        shell: bash
        run: |
          set -euo pipefail
          work="$(dirname "$GITHUB_WORKSPACE")/sdk030-launch-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$SLUG-$PRESET"
          mkdir -p "$work/out"
          echo "WORK=$work" >> "$GITHUB_ENV"
          cd "$work"
          hostname > out/runner.txt
          uname -a > out/uname.txt
          jq -ce --arg slug "$SLUG" --arg preset "$PRESET" '.[] | select(.slug == $slug and .preset == $preset)' "$GITHUB_WORKSPACE/.github/sdk030-launch/strix-fleet.json" > out/plan.json
          repo=$(jq -er .repo out/plan.json)
          revision=$(jq -er .revision out/plan.json)
          HF_REF="https://huggingface.co/$repo/resolve/$revision"
          for asset in llm_config.json info.json model.json model.json.lock; do
            curl -fsSL --retry 3 "$HF_REF/$asset" -o "out/$asset"
          done
          (cd out; sha256sum llm_config.json info.json model.json model.json.lock) > out/staging-sha256.txt
          jq -r '.files // {} | to_entries[] | "\(.value)  \(.key)"' out/plan.json > out/expected-sha256.txt
          if [ -s out/expected-sha256.txt ]; then (cd out; sha256sum -c expected-sha256.txt); fi
          sdk=$(bash "$GITHUB_WORKSPACE/skills/loom-setup/scripts/ensure_sdk.sh" "$work/loom" "$work/out/llm_config.json")
          echo "SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          cp "$sdk/loom-install.json" out/sdk.json
          test "$(jq -r .wheel_sha256 out/sdk.json)" = 6252bb0df262351175bdb2c4aaca22ffa63d80d791659aa4d2fa5c92a0af426f
          HF_HOME="$work/hf-home" "$sdk/.venv/bin/loom-fetch" "$HF_REF/model.json" --preset="$PRESET" --materialize=copy --no-input --cache "$work/fetch-cache" --output="$work/model" 2>&1 | tee out/fetch.log
          cp out/llm_config.json model/
          cp model/model.json out/selected-model.json
          "$sdk/.tools/bin/python" -I -c 'import sys; sys.path.insert(0, sys.argv[1]); from card_lib import programs_sha256; print(programs_sha256(sys.argv[2]))' "$GITHUB_WORKSPACE/skills/loom-benchmark/scripts/card" "$work/model" > out/programs_sha256.txt
      - name: Run matched same-machine current and bare launches
        shell: bash
        run: |
          "$SDK_ROOT/.tools/bin/python" -u "$GITHUB_WORKSPACE/.github/sdk030-launch/launch_ab.py" "$WORK" "$SDK_ROOT" "$GITHUB_WORKSPACE/skills/loom-benchmark/scripts"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strix-launch-${{ matrix.row.slug }}-${{ matrix.row.preset }}
          path: ${{ env.WORK }}/out
          retention-days: 30
      - name: Release job disk
        if: always()
        shell: bash
        run: |
          expected="$(dirname "$GITHUB_WORKSPACE")/sdk030-launch-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$SLUG-$PRESET"
          if [ "${WORK:-}" = "$expected" ]; then rm -rf -- "$WORK"; fi

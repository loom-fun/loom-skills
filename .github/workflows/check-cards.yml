name: check-cards

# loom-fun model cards are generated (skills/loom-benchmark/scripts/card): info.json by make_info.py, README.md
# and REPORT.md by render_card.py from info.json and the repo's model.json, model.json.lock and llm_config.json.
# Keep them deterministic and the template stable: fixture inputs must reproduce the golden files byte for byte.
on:
  pull_request:
    paths: ["skills/loom-benchmark/scripts/card/**", "skills/loom-benchmark/scripts/machine_info.py", "skills/loom-port-llm/starter/kit_source.py", "skills/loom-org/scripts/**", ".github/scripts/loom_factory.py", ".github/workflows/check-cards.yml"]
  push:
    branches: [main, r9700]
    paths: ["skills/loom-benchmark/scripts/card/**", "skills/loom-benchmark/scripts/machine_info.py", "skills/loom-port-llm/starter/kit_source.py", "skills/loom-org/scripts/**", ".github/scripts/loom_factory.py", ".github/workflows/check-cards.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Card generator matches the golden cards
        run: |
          python3 -m py_compile skills/loom-benchmark/scripts/card/*.py skills/loom-benchmark/scripts/machine_info.py \
            skills/loom-port-llm/starter/kit_source.py skills/loom-org/scripts/*.py .github/scripts/loom_factory.py
          skills/loom-benchmark/scripts/card/test/check.sh

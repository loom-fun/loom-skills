name: devlab-perf
# Performance experiments on AMD DevLab Dispatch Strix Halo runners: one matrix job per entry of "jobs" in
# .github/devlab/perf.json. Each job builds its package variants from this branch (or another ref), measures them
# against each other and against llama.cpp on the SAME runner (runners differ: never compare across jobs), and can
# run consistency / determinism loops, kernel tests and gates. See .github/scripts/devlab_perf.sh.
# Runs on a pull request labeled `devlab-perf` (every push re-runs it).
on:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

concurrency:
  group: devlab-perf-${{ github.ref }}-${{ github.event.label.name }}   # a skipped event for another label must not cancel this label's run
  cancel-in-progress: true

jobs:
  jobs:
    if: >-
      contains(github.event.pull_request.labels.*.name, 'devlab-perf') &&
      (github.event.action != 'labeled' || github.event.label.name == 'devlab-perf')
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}   # the job list the run step reads
      - id: pick
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          e = json.load(open(".github/devlab/perf.json"))
          print("matrix=" + json.dumps({"job": [j["name"] for j in e["jobs"]]}))
          PY

  run:
    needs: jobs
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.jobs.outputs.matrix) }}
    name: ${{ matrix.job }}
    runs-on: [strix-halo, devlab-dispatch, Linux, self-hosted]
    timeout-minutes: 240
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      C4_REPS: "8"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # variants may build with another commit's starter ("ref")
          # The PR head, not GitHub's temporary merge commit: build.py stamps the checkout's commit into the
          # package as its generator, and only the head stays reachable (the merge commit is replaced on every push).
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: work dir
        run: mkdir -p "$RUNNER_TEMP/../devlab-perf" && echo "WORK=$(cd "$RUNNER_TEMP/../devlab-perf" && pwd)" >> "$GITHUB_ENV"
      - name: "experiment: ${{ matrix.job }}"
        run: bash .github/scripts/devlab_perf.sh .github/devlab/perf.json "${{ matrix.job }}"
      - name: upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devlab-perf-${{ matrix.job }}
          path: ${{ env.WORK }}/${{ matrix.job }}/out
          retention-days: 14
      - name: clean up
        if: always()
        run: rm -rf "$WORK/_card" "$WORK/${{ matrix.job }}"

  summary:
    needs: [jobs, run]
    if: always() && needs.jobs.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: devlab-perf-*
          path: results
      - name: results per job
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, json
          print("| job | runner | step | result |\n|---|---|---|---|")
          for f in sorted(glob.glob("results/*/summary.json")):
              s = json.load(open(f))
              for k, v in s["results"].items():
                  print(f"| {s['job']} | {s.get('runner', '')} | {k} | {v} |")
          PY

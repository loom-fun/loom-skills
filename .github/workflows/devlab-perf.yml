name: devlab-perf
# Performance experiments on AMD DevLab Dispatch runners: one matrix job per entry of "jobs" in
# .github/devlab/perf.json, on the Strix Halo runner (default) or, with "runner": "r9700" on the job (or the experiment),
# the Radeon AI PRO R9700 runner. Each job builds its package variants from this branch (or another ref), measures them
# against each other and against llama.cpp on the SAME runner (runners differ: never compare across jobs), and can
# run consistency / determinism loops, kernel tests and gates. See .github/scripts/devlab_perf.sh.
# Its numbers are the cards' only performance source (loom-fleet reference/publish.md, "Performance: DevLab is the source").
# Runs on a pull request labeled `devlab-perf` (every push re-runs it).
on:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

concurrency:
  group: devlab-perf-${{ github.ref }}-${{ github.event.label.name }}   # a skipped event for another label must not cancel this label's run
  cancel-in-progress: true

jobs:
  jobs:
    if: >-
      contains(github.event.pull_request.labels.*.name, 'devlab-perf') &&
      (github.event.action != 'labeled' || github.event.label.name == 'devlab-perf')
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      bundle: ${{ steps.pick.outputs.bundle }}   # {"extension": "OWNER/REPO@REV", "gufo": "OWNER/REPO@REV"} when a job asks for a Gufo bundle built in this run, else ""
      bundle_run: ${{ steps.pick.outputs.bundle_run }}   # the id of an earlier run whose `gufo-bundle` artifact the jobs reuse ("bundle": {"run": "ID"}), else ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}   # the job list the run step reads
      - id: pick
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          e = json.load(open(".github/devlab/perf.json"))
          import sys
          sys.path.insert(0, "skills/loom-kb")
          import registry
          labels = registry.runner_labels()   # {runner key: runs-on labels} of the device registry (device.json runner; Strix includes Linux: without it a job can land on Windows)
          inc = []
          for j in e["jobs"]:
              r = j.get("runner") or e.get("runner") or "strix"
              assert r in labels, f"job {j['name']}: unknown runner {r!r} ({' | '.join(labels)})"
              timeout = j.get("timeout_minutes", e.get("timeout_minutes", 240))
              experiment_timeout = j.get("experiment_timeout_minutes", timeout)
              assert type(timeout) is int and 5 <= timeout <= 240, "timeout_minutes must be an integer in [5,240]"
              assert type(experiment_timeout) is int and 1 <= experiment_timeout <= timeout, "experiment_timeout_minutes must fit the job cap"
              inc.append({"job": j["name"], "labels": json.dumps(labels[r]),
                          "timeout_minutes": timeout, "experiment_timeout_minutes": experiment_timeout})
          print("matrix=" + json.dumps({"include": inc}))
          builds = {json.dumps(j["bundle"]["build"], sort_keys=True) for j in e["jobs"] if (j.get("bundle") or {}).get("build")}
          assert len(builds) <= 1, f"jobs ask for different Gufo bundles to build: {sorted(builds)}"
          print("bundle=" + (next(iter(builds)) if builds else ""))
          runs = {str(j["bundle"]["run"]) for j in e["jobs"] if (j.get("bundle") or {}).get("run")}
          assert len(runs) <= 1 and not (runs and builds), f"jobs ask for a bundle to build and/or reuse from different runs: {sorted(builds)} {sorted(runs)}"
          assert all(r.isdigit() for r in runs), f"bundle run must be a run id: {sorted(runs)}"
          print("bundle_run=" + (next(iter(runs)) if runs else ""))
          PY

  # The Gufo bundle (gufo + libloom_text_embed with their own loader, host logits steps `logits:V` / `gufo:V`) is built inside this run when a
  # job says "bundle": {"build": {"extension": "loom-fun/loom-gufo-extension@REV", "gufo": "loom-fun/gufo@REV"}}: Nix in Docker on a hosted
  # runner (validation/devlab/build_bundle.sh of the extension), the tarball cached by the two revisions and handed to the run jobs as an
  # artifact. Nothing is uploaded to Hugging Face or a release. The build takes hours: later experiments for the same two revisions set
  # "bundle": {"run": "RUN_ID"} instead (the id of the run that built it) and every job of theirs downloads that run's `gufo-bundle` artifact.
  bundle:
    needs: jobs
    if: needs.jobs.outputs.bundle != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - id: spec
        env:
          SPEC: ${{ needs.jobs.outputs.bundle }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          b = json.loads(os.environ["SPEC"])
          for k in ("extension", "gufo"):
              repo, rev = b[k].split("@")
              print(f"{k}_repo={repo}\n{k}_rev={rev}")
          PY
      - id: cache
        uses: actions/cache@v4
        with:
          path: bundle-out
          key: gufo-bundle-${{ steps.spec.outputs.gufo_rev }}-${{ steps.spec.outputs.extension_rev }}
      - uses: actions/checkout@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          repository: ${{ steps.spec.outputs.extension_repo }}
          ref: ${{ steps.spec.outputs.extension_rev }}
          path: ext
      - uses: actions/checkout@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          repository: ${{ steps.spec.outputs.gufo_repo }}
          ref: ${{ steps.spec.outputs.gufo_rev }}
          path: gufo
      - name: docker's storage on the big disk (the Nix store of the ROCm toolchain is tens of GB)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo systemctl stop docker docker.socket
          sudo mkdir -p /mnt/docker
          echo '{"data-root": "/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          df -h /mnt
      - name: build the bundle
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p bundle-out
          bash ext/validation/devlab/build_bundle.sh gufo bundle-out "gfx1151 gfx1201"
          ls -l bundle-out
      - run: |
          cd bundle-out && ls *.tar.gz | wc -l | grep -qx 1 && sha256sum -c *.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: gufo-bundle
          path: bundle-out/*.tar.gz
          retention-days: 30   # other runs reuse it by run id (a bundle build takes hours)

  run:
    needs: [jobs, bundle]
    if: always() && needs.jobs.result == 'success' && needs.bundle.result != 'cancelled'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.jobs.outputs.matrix) }}
    name: ${{ matrix.job }}
    runs-on: ${{ fromJSON(matrix.labels) }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # variants may build with another commit's starter ("ref")
          # The PR head, not GitHub's temporary merge commit: build.py stamps the checkout's commit into the
          # package as its generator, and only the head stays reachable (the merge commit is replaced on every push).
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: work dir
        run: mkdir -p "$RUNNER_TEMP/../devlab-perf" && echo "WORK=$(cd "$RUNNER_TEMP/../devlab-perf" && pwd)" >> "$GITHUB_ENV"
      - name: Gufo bundle built in this run
        if: needs.bundle.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: gufo-bundle
          path: ${{ env.WORK }}/_gufo-bundle-dl
      - name: Gufo bundle of an earlier run
        if: needs.jobs.outputs.bundle_run != ''
        uses: actions/download-artifact@v4
        with:
          name: gufo-bundle
          run-id: ${{ needs.jobs.outputs.bundle_run }}
          github-token: ${{ github.token }}
          path: ${{ env.WORK }}/_gufo-bundle-dl
      - name: unpack the bundle
        if: needs.bundle.result == 'success' || needs.jobs.outputs.bundle_run != ''
        run: |
          d="$WORK/_gufo-bundle/ci"; rm -rf "$d"; mkdir -p "$d"
          tar -xzf "$WORK"/_gufo-bundle-dl/*.tar.gz -C "$d" --strip-components=1
          rm -rf "$WORK/_gufo-bundle-dl"
          echo "GUFO_BUNDLE=$d" >> "$GITHUB_ENV"
      - name: "experiment: ${{ matrix.job }}"
        timeout-minutes: ${{ matrix.experiment_timeout_minutes }}
        run: bash .github/scripts/devlab_perf.sh .github/devlab/perf.json "${{ matrix.job }}"
      - name: upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devlab-perf-${{ matrix.job }}
          path: ${{ env.WORK }}/${{ matrix.job }}/out
          retention-days: 14
      - name: clean up
        if: always()
        run: rm -rf "$WORK/_card" "$WORK/${{ matrix.job }}"

  summary:
    needs: [jobs, run]
    if: always() && needs.jobs.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: devlab-perf-*
          path: results
      - name: results per job
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, json
          print("| job | runner | step | result |\n|---|---|---|---|")
          for f in sorted(glob.glob("results/*/summary.json")):
              s = json.load(open(f))
              for k, v in s["results"].items():
                  print(f"| {s['job']} | {s.get('runner', '')} | {k} | {v} |")
          PY

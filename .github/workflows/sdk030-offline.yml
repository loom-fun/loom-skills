name: SDK 0.3.0 offline fleet proof
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  sdk-offline:
    if: github.event.pull_request.head.ref == 'codex/sdk030-migration' && github.event.pull_request.head.repo.full_name == github.repository && github.event.label.name == 'sdk030-offline'
    runs-on: [strix-halo, devlab-dispatch, Linux, self-hosted]
    timeout-minutes: 85
    env:
      WORK: ${{ github.workspace }}/sdk030-offline-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install and compare official SDKs
        shell: bash
        run: |
          mkdir -p "$WORK/evidence"
          export LOOM_SKILL_DIR="$PWD/skills/loom-setup"
          for sdk in 0.2.0 0.3.0; do
            bash "$LOOM_SKILL_DIR/scripts/install_loom.sh" "$WORK/$sdk" "release:$sdk" 2>&1 | tee "$WORK/evidence/install-$sdk.log"
            cp "$WORK/$sdk/loom-install.json" "$WORK/evidence/sdk-$sdk.json"
            git -C "$WORK/$sdk/library" rev-parse HEAD > "$WORK/evidence/catalog-$sdk.txt"
          done
          grep -Fq 6252bb0df262351175bdb2c4aaca22ffa63d80d791659aa4d2fa5c92a0af426f "$WORK/evidence/sdk-0.3.0.json"
          for tool in loom-serve loom-fetch loom-opt loom-link loom-test loom-translate loom-compile loom-import-cxx; do
            for sdk in 0.2.0 0.3.0; do
              "$WORK/$sdk/.venv/bin/$tool" --help > "$WORK/evidence/$tool-$sdk.help" 2>&1 || true
            done
            diff -u "$WORK/evidence/$tool-0.2.0.help" "$WORK/evidence/$tool-0.3.0.help" > "$WORK/evidence/$tool.diff" || true
          done
          git -C "$WORK/0.3.0/library" diff --stat v0.2.0..v0.3.0 > "$WORK/evidence/library-diff.txt"
      - name: Snapshot production packages and build the old kit
        shell: bash
        run: |
          cat > "$WORK/snapshot.py" <<'PY'
          import concurrent.futures
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import time
          from urllib.parse import quote
          import urllib.request

          work = Path(os.environ["WORK"])

          def request(path):
              for attempt in range(4):
                  try:
                      with urllib.request.urlopen("https://huggingface.co" + path, timeout=45) as response:
                          return response.read()
                  except OSError:
                      if attempt == 3:
                          raise
                      time.sleep(2 ** attempt)

          def card(repo, revision):
              meta = json.loads(request(f"/api/models/{repo}/revision/{revision}"))
              assert meta["sha"] == revision, (repo, revision, meta["sha"])
              root = work / "published" / repo.split("/")[-1]
              root.mkdir(parents=True)
              base = f"/{repo}/resolve/{revision}/"
              files = {f["rfilename"] for f in meta["siblings"]}
              raw = request(base + "model.json")
              model = json.loads(raw)
              (root / "model.json").write_bytes(raw)
              used = set()
              for p in model["programs"].values():
                  for entry in p.get("inputs", []) + p.get("libraries", []):
                      path = entry if isinstance(entry, str) else entry["path"]
                      used.add(path)
                      if isinstance(entry, dict):
                          used.update(
                              x if isinstance(x, str) else x["path"]
                              for x in entry.get("data", [])
                              if (x if isinstance(x, str) else x["path"]).endswith(".loom")
                          )
              assert used and used <= files, (repo, used - files)
              for file in sorted(used):
                  parts = PurePosixPath(file)
                  assert not parts.is_absolute() and ".." not in parts.parts
                  dst = root / file
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  dst.write_bytes(request(base + quote(file)))
              pin = json.loads(request(base + "llm_config.json")).get("sdk") if "llm_config.json" in files else None
              info = json.loads(request(base + "info.json")) if "info.json" in files else {}
              return dict(
                  devices=list(info.get("devices", {})),
                  repo=repo, revision=revision, sdk=pin,
                  model_json_sha256=hashlib.sha256(raw).hexdigest(),
                  services={key: {"kind": value.get("kind"), "version": value.get("version")}
                            for key, value in model.get("services", {}).items()},
                  variants=list(model.get("variants", {})),
                  presets=list(model.get("presets", {})),
                  program_files=len(used), has_info="info.json" in files,
              )

          repos = {"loom-fun/amd-Qwen3.8-27B-Quark-AWQ-MXFP4-loom":"a999be30c6539c77a030e961748416892b06ac73","loom-fun/bartowski-LFM3-1.7B-loom":"b2554fcb467b22105aff94eb4b63e2017bc76e4c","loom-fun/bartowski-Mellum2.1-12B-A2.5B-Thinking-loom":"5d172ab9262e8f7f64f14541d43b876f150132fe","loom-fun/bartowski-MiniCPM-V-4.7-35B-A3B-loom":"bb64688865697edb8b1f1329dc9bf1c32d520e71","loom-fun/bartowski-Nanbeige4.3-33B-loom":"bfe6f26ea510f721ba5751dc5115e8fca18ef66b","loom-fun/bartowski-Ornith-1.5-122B-loom":"549484e582abe6c5014b27d76a82fc5f63c7c45f","loom-fun/bartowski-Ornith-1.5-35B-A3B-loom":"a04f7adb325c45a30c8c9a5196bc4bac3e98fb9e","loom-fun/bartowski-Ornith-1.5-9B-loom":"fd3c6efebabc4ea9502c296326402a079bb84827","loom-fun/bartowski-Qwen2.5-0.5B-Instruct-loom":"6fe5ac03a656c4e5d51ecb270c7d7bedc56c2a57","loom-fun/bartowski-Qwen2.5-1.5B-Instruct-loom":"a78f4fd5b9cda2a40ce321c2f60ea09228ca9950","loom-fun/bartowski-Qwen2.5-32B-Instruct-loom":"07da8bface8f684e61d007ed15295e861c734a33","loom-fun/bartowski-Qwen2.5-7B-Instruct-loom":"7a755e3f50d67b6bf97487135d025c19cce0f14c","loom-fun/bartowski-Qwen3.8-27B-loom":"a73a11eba342bde5e2ab489b2687cf731b9c7128","loom-fun/bartowski-Spark-X2.6-4B-loom":"d38e0b2578353ca0a7dc999b3c8ee44944ad1753","loom-fun/black-forest-labs-FLUX.2-klein-4B-loom":"b21b10a168c368d67303fea32f5dbc5f6398375e","loom-fun/ggml-org-Flint-loom":"d60f073d32ca9f4c78fb20e79bb1187f8d60841f","loom-fun/ggml-org-gemma-3-1b-it-loom":"ed544f633706e706da5098bd5f2fd3c1579921ac","loom-fun/ggml-org-Laguna-XS-2.1-loom":"640cfee4a72a1336888459ba83948d5d74ab9f44","loom-fun/ggml-org-LFM2.5-24B-A2B-loom":"5dc159ccab5c1f446f7f5454ff5a94d9f78ac280","loom-fun/ggml-org-LFM3-Omni-2B-loom":"82e3ff40dd639c936f2909111d73191b2d6d0da6","loom-fun/ggml-org-Muse-Glimmer-30B-loom":"40344e99e4b4d632b89c45278e5d1ffc46023cfb","loom-fun/ggml-org-Qwen2.5-VL-7B-Instruct-loom":"2611dac7db74f0042ce3fc06dd821ca613efe3fa","loom-fun/ggml-org-Qwen3-1.7B-loom":"e1d356b458ad21cb476546c6454abbb4f32a3bf2","loom-fun/ggml-org-Qwen3-14B-loom":"71bad2d9362daa394f2ed58ae5fb97628a139021","loom-fun/ggml-org-Qwen3-4B-loom":"b0944ed9f7f284e15f31aa4a9d14473c193707a8","loom-fun/ggml-org-Qwen3-Coder-30B-A3B-Instruct-loom":"90f4d2874d066ab7ad0c16daab9a383fa55f47a5","loom-fun/ggml-org-Qwen3.6-27B-loom":"f86d908dd9e7caaf8312c4f753a600c3dfdc6ad8","loom-fun/ggml-org-Qwen3.6-35B-A3B-loom":"9a06cc9ba5ca93e2de3a5fa40b2ad4e415d191fe","loom-fun/InternScience-Sage-A1.5-loom":"bfa32772063c03a549b3452520d3110e0d978f2f","loom-fun/jdopensource-JoyAI-LLM-Flash-loom":"cb7861a81dbb586782044145ebb11f8cd48d8c8e","loom-fun/lmstudio-community-gemma-4-26B-A4B-it-loom":"eb2bd1117e4a1de4d949b39fb6ac217e7ef35e6a","loom-fun/lmstudio-community-Ornith-1.0-35B-loom":"70e56c1cc62e13fda963337500228fded6ffdb9d","loom-fun/nvidia-NVIDIA-Nemotron-3.5-Bolt-E4B-4GB-loom":"3f36ed722f6c8bdb51d90526bc05e03a05f24dbf","loom-fun/rippertnt-HyperCLOVAX-SEED-Text-Instruct-1.5B-loom":"0c8e8831544e6625431a8177873fa531e75d0cc0","loom-fun/Tongyi-MAI-Z-Image-Turbo-loom":"77e103e314324c35a88b62350286b07e8dc0f05d","loom-fun/unsloth-gemma-4-12B-it-loom":"34d4382c23b9357cd46894e7a6b1577aa86cf084","loom-fun/unsloth-gemma-4-26B-A4B-it-qat-loom":"da1e6ae137920f0565d989e0731128288eb712e3","loom-fun/unsloth-gemma-4-31B-it-loom":"568071f2fbee4b39c45d10ed9ea2453d5eec7137","loom-fun/unsloth-gemma-4-31B-it-qat-loom":"0826c6e9d4cc3971f94f2730a07f6b33ad9982e2","loom-fun/unsloth-gemma-4-E2B-it-loom":"3503abcf7cfff7bc58bd819ea32ccab8c18c075d","loom-fun/unsloth-gemma-4-E4B-it-loom":"e53717d9759ed9faa3454a65818c8401b5ff9f14","loom-fun/unsloth-gpt-oss-20b-loom":"caf72ae4ed037eeaeb9d818b7d3e358ba464c16a","loom-fun/unsloth-Inkling-2-Mini-loom":"4e018e88a3aa9826286c71dfe2f6c905a491659b","loom-fun/unsloth-Inkling-2-Mini-loom-r9700":"6213fd3ce3a15ea2bab98d4adf09ec783c5ad5dc","loom-fun/unsloth-Llama-3.2-3B-Instruct-loom":"c6defa4cd5a8764b2cd8d4c14cb81ca0f118a76c","loom-fun/unsloth-Ornith-1.0-9B-loom":"dff6b66ed20512c86ec2f847bfe78fc6b5589149","loom-fun/unsloth-Qwen3-0.6B-loom":"564d578f4e487c6fbabd84915439f873651b5953","loom-fun/unsloth-Qwen3-30B-A3B-Instruct-2507-loom":"c6598438289b2cbb1543e73e90b749136c888797","loom-fun/unsloth-Qwen3-4B-Instruct-2507-loom":"d0df214dfcbf73e905ad7930498e110bb5525e3d","loom-fun/unsloth-Qwen3-8B-loom":"35d393f359b50ec874e5f2d635bcf03fb48d080f","loom-fun/unsloth-Qwen3-VL-4B-Instruct-loom":"c9e8f9868c0be8bbef11ee5f7bebf35f2feb419b","loom-fun/unsloth-Qwen3-VL-8B-Instruct-loom":"4c126a53d2beabbcd03700071be10ac811b6778a","loom-fun/unsloth-Qwen3.5-0.8B-loom":"9131414f6d7c0e37a890bb23fb7a1693e82b4db3","loom-fun/unsloth-Qwen3.5-2B-loom":"5891a2d021871b4eb8e0e0adfd87bd20ab940c9e","loom-fun/unsloth-Qwen3.5-35B-A3B-loom":"89e9db91429a851ccf55e5f31f3c81d1c3b7bea4","loom-fun/unsloth-Qwen3.5-4B-loom":"64bf40259117d99f3e6a9f43b7e80fb030300697","loom-fun/unsloth-Qwen3.5-9B-loom":"331114c19f4c4cbeb40ffac290659dbc8be7936c","loom-fun/unsloth-Qwen3.8-27B-UD-Q4_K_XL":"3e43d41d0bfae65f17a77794264f82a3b5f2c990","loom-fun/unsloth-Qwen3.8-Flash-Next-loom":"d847c21bc93c0c6bc45752a9edaf91d80ac74490","loom-fun/XHToken-Spark-X2.5-4B-loom":"b2e87e163ac1e1db1912ea4aaed57bc3816b78a5","loom-fun/xinntao-Real-ESRGAN-x4plus-loom":"d7126ceb45f03476c8f6608ba77959dd48fe4515"}
          evidence = work / "evidence"
          (evidence / "accepted-revisions.json").write_text(json.dumps(repos, indent=2))
          current = {x["id"]: x["sha"] for x in json.loads(request("/api/models?author=loom-fun&limit=1000&full=true"))}
          drift = {"added": {k: current[k] for k in sorted(current.keys() - repos.keys())},
                   "removed": {k: repos[k] for k in sorted(repos.keys() - current.keys())},
                   "updated": {k: {"accepted": repos[k], "current": current[k]}
                               for k in sorted(repos.keys() & current.keys()) if repos[k] != current[k]}}
          (evidence / "inventory-drift.json").write_text(json.dumps(drift, indent=2))
          print("Accepted production inventory:", len(repos), "drift:", drift, flush=True)
          results, errors = [], []
          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as executor:
              tasks = {executor.submit(card, repo, revision): repo for repo, revision in repos.items()}
              for task in concurrent.futures.as_completed(tasks):
                  try:
                      results.append(task.result())
                  except Exception as error:
                      errors.append({"repo": tasks[task], "error": repr(error)})
          (work / "evidence/inventory.json").write_text(json.dumps(
              {"packages": sorted(results, key=lambda r: r["repo"]), "errors": errors}, indent=2))
          print(f"Published snapshots: {len(results)}/{len(repos)}; missing: {errors}", flush=True)
          PY
          "$WORK/0.3.0/.tools/bin/pip" install -q pyyaml
          "$WORK/0.3.0/.tools/bin/python" "$WORK/snapshot.py" &
          snapshot_pid=$!
          old_root="$WORK/0.2.0"
          PATH="$old_root/.venv/bin:$PATH" LOOM_ROOT="$old_root" \
            "$WORK/0.3.0/.tools/bin/python" fleet/build_fleet.py \
              --ref "${{ github.event.pull_request.base.sha }}" --out "$WORK/generated" --jobs 8 \
              2>&1 | tee "$WORK/evidence/generated-build.log" || true
          cp "$WORK/generated/summary.json" "$WORK/evidence/generated-summary.json"
          wait "$snapshot_pid"
      - name: Compare published and generated programs on both SDKs
        shell: bash
        run: |
          export LOOM_SKILL_DIR="$PWD/skills/loom-migrate"
          # Older sweep assumes every data entry is a string. Resolve dicts in the
          # sweep's temporary copy so exact published model.json bytes remain intact.
          python3 - "$LOOM_SKILL_DIR/scripts/sweep.py" "$WORK/sweep.py" <<'PY'
          import pathlib, sys
          sweep = pathlib.Path(sys.argv[1]).read_text()
          sweep = sweep.replace('if p.endswith(".loom") and p not in out:',
                                'p = p["path"] if isinstance(p, dict) else p\n                if p.endswith(".loom") and p not in out:')
          pathlib.Path(sys.argv[2]).write_text(sweep)
          PY
          for corpus in published generated; do
            for sdk in 0.2.0 0.3.0; do
              set +e
              timeout 22m python3 "$WORK/sweep.py" "$WORK/$corpus" \
                --sdk "$WORK/$sdk/.venv" --jobs 8 --json "$WORK/evidence/$corpus-$sdk.json" \
                2>&1 | tee "$WORK/evidence/$corpus-$sdk.log"
              status=${PIPESTATUS[0]}
              set -e
              printf '%s\n' "$status" > "$WORK/evidence/$corpus-$sdk.exit"
            done
          done
          python3 - "$WORK" <<'PY'
          import json, pathlib, sys
          work = pathlib.Path(sys.argv[1])
          evidence = work / "evidence"
          result = {}
          for corpus in ("published", "generated"):
              before, after = (json.loads((evidence / f"{corpus}-{sdk}.json").read_text())["packages"]
                               for sdk in ("0.2.0", "0.3.0"))
              identical = before == after
              issues = {slug: {"parse": row["parse"], "link": row["link"]}
                        for slug, row in after.items() if row["parse"] or row["link"]}
              result[corpus] = {"identical": identical, "issues": issues}
              print(corpus, "package-by-package findings identical:", identical)
              for slug, row in issues.items():
                  for stage, failures in row.items():
                      for f in failures:
                          print(corpus, slug, stage, f.get("file") or f.get("where"), f["msg"])
          inventory = json.loads((evidence / "inventory.json").read_text())
          in_manifest = set(json.loads(pathlib.Path("fleet/manifest.json").read_text())["models"])
          for row in inventory["packages"]:
              slug = row["repo"].split("/")[-1]
              row["manifest"] = slug in in_manifest
              if not row["manifest"]:
                  print("Manual lane:", row["repo"], row["revision"], row["services"])
          (evidence / "inventory.json").write_text(json.dumps(inventory, indent=2))
          (evidence / "comparison.json").write_text(json.dumps(result, indent=2))
          accepted = json.loads((evidence / "accepted-revisions.json").read_text())
          actual = {row["repo"]: row["revision"] for row in inventory["packages"]}
          assert actual == accepted and not inventory["errors"]
          assert all(row["identical"] for row in result.values())
          PY
      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk030-offline-proof
          path: ${{ env.WORK }}/evidence
          retention-days: 30
      - name: Remove runner scratch
        if: always()
        shell: bash
        run: rm -rf -- "$WORK"
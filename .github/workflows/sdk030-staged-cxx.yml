name: DevLab Gufo Nix builds and staged C++ model proof
on:
  push:
    branches: [codex/sdk030-consumer-devlab]
    paths:
      - .github/workflows/sdk030-staged-cxx.yml
permissions:
  contents: read
jobs:
  staged-cxx:
    runs-on: [strix-halo, devlab-dispatch, Linux, self-hosted]
    timeout-minutes: 100
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '8'
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare isolated runner workspace
        shell: bash
        run: |
          set -euo pipefail
          work=$(mktemp -d "$RUNNER_TEMP/sdk030-staged-cxx.XXXXXX")
          echo "WORK=$work" >> "$GITHUB_ENV"
          mkdir "$work/out"
          hostname > "$work/out/runner.txt"
          awk '/MemAvailable/ { print; if ($2 < 107421875) exit 1 }' /proc/meminfo | tee "$work/out/memavailable.txt"
      - name: Build both pinned Nix runtimes and run the staged model probes
        shell: bash
        run: bash .github/sdk030-staged-cxx/run.sh
      - uses: actions/upload-artifact@v4
        if: always() && env.WORK != ''
        with:
          name: sdk030-staged-cxx
          path: ${{ env.WORK }}/out
      - name: Remove isolated workspace
        if: always() && env.WORK != ''
        shell: bash
        run: |
          case "$WORK" in "$RUNNER_TEMP"/sdk030-staged-cxx.*) rm -rf -- "$WORK";; *) exit 1;; esac

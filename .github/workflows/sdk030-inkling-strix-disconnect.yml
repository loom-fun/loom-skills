name: Inkling Strix native transport retirement
on:
  push:
    branches: [codex/sdk030-special-qualification]
    paths: [.github/workflows/sdk030-inkling-strix-disconnect.yml]
permissions:
  contents: read
jobs:
  verify:
    name: ${{ matrix.device }} ${{ matrix.slug }}
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        include:
          - slug: unsloth-Inkling-2-Mini-loom
            device: strix-halo
            labels: '["self-hosted","devlab-dispatch","strix-halo","Linux"]'
    runs-on: ${{ fromJSON(matrix.labels) }}
    timeout-minutes: 240
    env:
      SLUG: ${{ matrix.slug }}
      SDK_GPU_KEY: ${{ matrix.device }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2b78eebf5c93b8b1d92d86d0fbe20275c674cde2
          fetch-depth: 0
          persist-credentials: false
      - name: Plan from the accepted production revision
        shell: bash
        run: |
          set -euo pipefail
          export WORK="$(dirname "$GITHUB_WORKSPACE")/sdk030-wave-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$SDK_GPU_KEY-$SLUG"
          mkdir -p "$WORK/receipt"
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, os
          from pathlib import Path
          slug = os.environ['SLUG']
          def job(name, card):
              return dict(name=name, card='loom-fun-staging/'+card, sdk='0.3.0', variants=[dict(name='staging',sdk='0.3.0')],
                          steps=[f'disconnect:staging:{mode}' for mode in ('fin','reset','complete')])
          plan=dict(runner='strix',memory_bytes=33000000000,jobs=[
              job('inkling','unsloth-Inkling-2-Mini-loom@bd021e649b158e608b389eca9bfed60a0ec2d225'),
              job('control','unsloth-Qwen3-8B-loom@701b15c229b3e96ea7f4e9da01197e1525c1961f')])
          out=Path(os.environ['WORK'])/'receipt'
          (out/'experiment.json').write_text(json.dumps(plan,indent=2))
          h=Path('.github/scripts/devlab_perf.sh')
          source=h.read_text()
          anchor='    ln -sfn "$vcard/parameter" "$pkg/parameter"'
          assert source.count(anchor)==1
          import base64
          (Path(os.environ['WORK'])/'disconnect.py').write_bytes(base64.b64decode(''))
          probe='''    disconnect)
                serve_alone "$p1" || { res[$s]=ERROR; continue; }
                if PYTHONPATH="$B" "$T" "$WORK/disconnect.py" "$D/$p1/pkg" "$url" "$p2" "$out/$p2.json"; then
                  curl -fsS "$url/metrics" > "$out/$p2.metrics.txt" || true
                  res[$s]=CAPTURED
                else res[$s]=ERROR; fi;;
              func)'''
          assert source.count('    func)')==1
          source=source.replace('    func)',probe)
          h.write_text(source.replace(anchor,'    rsync -a --exclude=/parameter --exclude=/.git "$vcard/" "$pkg/"\n'+anchor))
          print('JOB=inkling')
          PY
      - name: Capture identical native requests on one Strix runner per package
        shell: bash
        run: |
          set -euo pipefail
          for job in inkling control; do
            bash .github/scripts/devlab_perf.sh "$WORK/receipt/experiment.json" "$job"
          done
      - name: Preserve cancellation timings, telemetry and checkpoint identity
        if: always() && env.JOB != ''
        shell: bash
        run: |
          for job in inkling control; do
            if [ -d "$WORK/$job/out" ]; then cp -r "$WORK/$job/out" "$WORK/receipt/$job"; fi
          done
      - name: Check equivalent requests and report prefill and retirement time
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, os
          root=Path(os.environ['WORK'])/'receipt'
          for job in ('inkling','control'):
              out=root/job
              rows=[json.loads((out/f'{mode}.json').read_text()) for mode in ('fin','reset','complete')]
              assert len({row['request_sha256'] for row in rows})==1, rows
              assert all(row['active_observed_s'] is not None for row in rows)
              for row in rows:
                  print(job,{k:v for k,v in row.items() if k not in ('status','response')},flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inkling-strix-disconnect
          path: ${{ env.WORK }}/receipt
          retention-days: 30
      - name: Release job disk
        if: always()
        shell: bash
        run: |
          if [ "${WORK:-}" = "$(dirname "$GITHUB_WORKSPACE")/sdk030-wave-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$SDK_GPU_KEY-$SLUG" ]; then rm -rf -- "$WORK"; fi




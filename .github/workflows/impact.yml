name: impact

# Every PR: what do its programs do to the fleet, and does it stay inside the mandate its `loom-scope` block declares?
# Plans from changed inputs (never the author's claimed scope), then builds affected models at both revisions in parallel
# CPU shards. Shared/unknown inputs keep full-fleet coverage; non-input PRs still run scope lint but build nothing.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: impact-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      builds: ${{ steps.plan.outputs.builds }}
      base: ${{ steps.plan.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select affected models and independent revision/shard jobs
        id: plan
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/impact-pr-body.md"
          python3 fleet/impact_plan.py plan --base "origin/$BASE_REF" --pr-body "$RUNNER_TEMP/impact-pr-body.md" \
            --out impact-plan.json --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: impact-plan
          path: impact-plan.json
          retention-days: 7

  build:
    needs: plan
    if: needs.plan.outputs.builds != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU build dependencies
        id: deps
        run: |
          python -m pip install --quiet gguf numpy jinja2 pyyaml tokenizers
          echo "key=$(python -m pip freeze | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache
        with:
          path: ${{ runner.temp }}/impact/${{ matrix.side }}
          key: impact-v1-py312-${{ matrix.key }}-${{ steps.deps.outputs.key }}
      - name: Build this revision and model shard
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          BUILD_REF: ${{ matrix.ref }}
          BUILD_SLUGS: ${{ matrix.slugs }}
          BUILD_SIDE: ${{ matrix.side }}
          BUILD_SHARD: ${{ matrix.shard }}
        run: |
          python fleet/build_fleet.py --ref "$BUILD_REF" --slugs "$BUILD_SLUGS" --out "$RUNNER_TEMP/impact/$BUILD_SIDE" --jobs 2
          mv "$RUNNER_TEMP/impact/$BUILD_SIDE/summary.json" "$RUNNER_TEMP/impact/$BUILD_SIDE/summary-$BUILD_SHARD.json"
      - uses: actions/upload-artifact@v4
        with:
          name: impact-build-${{ matrix.side }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/impact
          retention-days: 7

  impact:
    needs: [plan, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require a successful plan and every build shard
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          BUILD_COUNT: ${{ needs.plan.outputs.builds }}
        run: |
          test "$PLAN_RESULT" = success
          if [ "$BUILD_COUNT" != 0 ]; then test "$BUILD_RESULT" = success; fi
      - uses: actions/download-artifact@v4
        with:
          name: impact-plan
          path: ${{ runner.temp }}/impact
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.builds != '0'
        with:
          pattern: impact-build-*
          path: ${{ runner.temp }}/impact
          merge-multiple: true
      - name: Aggregate complete shards and diff the selected models
        id: diff
        run: |
          set -e
          t0=$(date +%s)
          python fleet/impact_plan.py aggregate --plan "$RUNNER_TEMP/impact/impact-plan.json" --builds "$RUNNER_TEMP/impact" --out "$RUNNER_TEMP/impact"
          echo "diff_seconds=$(( $(date +%s) - t0 ))" >> "$GITHUB_OUTPUT"
      - name: Scope lint
        id: lint
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/impact/body.md"
          set +e
          python fleet/scope_lint.py --base "${{ needs.plan.outputs.base }}" --head HEAD --pr-body "$RUNNER_TEMP/impact/body.md" \
            --impact "$RUNNER_TEMP/impact/impact.json" --json "$RUNNER_TEMP/impact/lint.json" --md "$RUNNER_TEMP/impact/lint.md"
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Sampled-test plan
        run: |
          python fleet/sample_plan.py "$RUNNER_TEMP/impact/impact.json" > "$RUNNER_TEMP/impact/plan.txt" 2>&1 || true
      - name: Compose and post the PR comment
        continue-on-error: true   # forks cannot write comments
        env:
          GH_TOKEN: ${{ github.token }}
          DIFF_SECONDS: ${{ steps.diff.outputs.diff_seconds }}
          BUILD_COUNT: ${{ needs.plan.outputs.builds }}
        run: |
          d="$RUNNER_TEMP/impact"
          {
            echo "<!-- loom-impact -->"
            echo "## Fleet impact and scope lint"
            echo
            cat "$d/lint.md"
            echo
            cat "$d/impact.md"
            echo
            echo "<details><summary>Sampled-test plan (strata, representatives, DevLab jobs)</summary>"
            echo
            echo '```'
            head -c 20000 "$d/plan.txt"
            echo '```'
            echo "</details>"
            echo
            echo "_CPU build shards: ${BUILD_COUNT}; aggregation and diff: ${DIFF_SECONDS}s. Coverage and selection rationale above._"
          } > "$d/comment.md"
          id=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" --paginate \
                 --jq '[.[] | select(.body | startswith("<!-- loom-impact -->"))][0].id // empty')
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$id" -F body=@"$d/comment.md" > /dev/null
          else
            gh api -X POST "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" -F body=@"$d/comment.md" > /dev/null
          fi
      - name: Job summary
        run: |
          cat "$RUNNER_TEMP/impact/lint.md" "$RUNNER_TEMP/impact/impact.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Fail on lint errors
        if: steps.lint.outputs.rc != '0'
        run: |
          cat "$RUNNER_TEMP/impact/lint.md"
          exit 1

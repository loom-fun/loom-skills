name: impact

# Every PR: what do its programs do to the fleet, and does it stay inside the mandate its `loom-scope` block declares?
# Builds the 51 published models (programs only, CPU) at the base and at the PR head, diffs them (fleet/diff_fleet.py), runs the
# scope lint (fleet/scope_lint.py) with the PR body, prints the sampled-test plan (fleet/sample_plan.py), and keeps ONE PR comment
# up to date. The check fails on lint errors. No GPU, no weights.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: impact-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  impact:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the build dependency (inspect_gguf.py, build.py)
        run: python -m pip install --quiet gguf numpy jinja2 tokenizers
      - name: Fleet program diff (base vs head)
        id: diff
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -e
          t0=$(date +%s)
          mkdir -p "$RUNNER_TEMP/impact"
          base=$(git merge-base "origin/$BASE_REF" HEAD)
          jobs=$(nproc)
          python fleet/build_fleet.py --ref "$base" --out "$RUNNER_TEMP/impact/base" --jobs "$jobs" > "$RUNNER_TEMP/impact/build_base.log" 2>&1 || { tail -30 "$RUNNER_TEMP/impact/build_base.log"; exit 1; }
          python fleet/build_fleet.py --tree . --out "$RUNNER_TEMP/impact/head" --jobs "$jobs" > "$RUNNER_TEMP/impact/build_head.log" 2>&1 || { tail -30 "$RUNNER_TEMP/impact/build_head.log"; exit 1; }
          python fleet/diff_fleet.py "$RUNNER_TEMP/impact/base" "$RUNNER_TEMP/impact/head" --json "$RUNNER_TEMP/impact/impact.json" --md "$RUNNER_TEMP/impact/impact.md"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "build_seconds=$(( $(date +%s) - t0 ))" >> "$GITHUB_OUTPUT"
      - name: Scope lint
        id: lint
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/impact/body.md"
          set +e
          python fleet/scope_lint.py --base "${{ steps.diff.outputs.base }}" --head HEAD --pr-body "$RUNNER_TEMP/impact/body.md" \
            --impact "$RUNNER_TEMP/impact/impact.json" --json "$RUNNER_TEMP/impact/lint.json" --md "$RUNNER_TEMP/impact/lint.md"
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Sampled-test plan
        run: |
          python fleet/sample_plan.py "$RUNNER_TEMP/impact/impact.json" > "$RUNNER_TEMP/impact/plan.txt" 2>&1 || true
      - name: Compose and post the PR comment
        continue-on-error: true   # forks cannot write comments
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SECONDS: ${{ steps.diff.outputs.build_seconds }}
        run: |
          d="$RUNNER_TEMP/impact"
          {
            echo "<!-- loom-impact -->"
            echo "## Fleet impact and scope lint"
            echo
            cat "$d/lint.md"
            echo
            cat "$d/impact.md"
            echo
            echo "<details><summary>Sampled-test plan (strata, representatives, DevLab jobs)</summary>"
            echo
            echo '```'
            head -c 20000 "$d/plan.txt"
            echo '```'
            echo "</details>"
            echo
            echo "_fleet build and diff: ${BUILD_SECONDS}s on the runner._"
          } > "$d/comment.md"
          id=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" --paginate \
                 --jq '[.[] | select(.body | startswith("<!-- loom-impact -->"))][0].id // empty')
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$id" -F body=@"$d/comment.md" > /dev/null
          else
            gh api -X POST "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" -F body=@"$d/comment.md" > /dev/null
          fi
      - name: Job summary
        run: |
          cat "$RUNNER_TEMP/impact/lint.md" "$RUNNER_TEMP/impact/impact.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Fail on lint errors
        if: steps.lint.outputs.rc != '0'
        run: |
          cat "$RUNNER_TEMP/impact/lint.md"
          exit 1

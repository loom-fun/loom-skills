name: SDK 0.3.0 migration implementation proof
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  implement:
    if: github.event.pull_request.head.ref == 'codex/sdk030-migration' && github.event.pull_request.head.repo.full_name == github.repository && github.event.label.name == 'sdk030-implement'
    runs-on: [strix-halo, devlab-dispatch, Linux, self-hosted]
    timeout-minutes: 45
    env:
      WORK: ${{ github.workspace }}/sdk030-implement-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Implement the staged migration
        shell: bash
        run: |
          mkdir -p "$WORK/evidence"
          python3 - <<'PY'
          from pathlib import Path
          
          def edit(name, replacements):
              path = Path(name)
              text = path.read_text()
              for before, after in replacements:
                  assert before in text, (name, before)
                  text = text.replace(before, after, 1)
              path.write_text(text)
          
          edit("fleet/regen.py", [
              ('SDK_OLD, SDK_NEW = "card", "0.2.0"', '''SDK_OLD, SDK_NEW = "card", "0.2.0"
          SDK_030_PIN = {
              "hrx_loom": "0.3.0",
              "source": "pypi",
              "hrx_system_sha": "e2c41a720363911c04606ce0f4417e2d55630352",
              "wheel_sha256": "6252bb0df262351175bdb2c4aaca22ffa63d80d791659aa4d2fa5c92a0af426f",
          }
          
          
          def target_sdk(state):
              return state["opts"].get("new_sdk", SDK_NEW)
          
          
          def measured_sdk_030(job):
              """Require the verified Linux wheel for both performance variants."""
              directory = job.get("dir")
              if not directory:

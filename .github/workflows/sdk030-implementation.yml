          DATA
          git add -- fleet/regen.py tests/test_regen.py skills/loom-migrate/SKILL.md \
            skills/loom-migrate/scripts/sweep.py skills/loom-migrate/versions/v0.2.0-to-v0.3.0.md \
            skills/loom-migrate/versions/v0.2.0-to-v0.3.0-production.json
          git diff --cached --check
          git diff --cached --binary > "$WORK/evidence/changes.patch"
          mkdir -p "$WORK/evidence/changes"
          git diff --cached --name-only -z | xargs -0 cp --parents -t "$WORK/evidence/changes"
          git config user.name "Loom SDK migration on DevLab"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add opt-in SDK 0.3.0 migration from pinned production packages"
          git rev-parse HEAD > "$WORK/evidence/tested-commit.txt"
          git bundle create "$WORK/evidence/changes.bundle" HEAD "^HEAD^"
      - name: Verify migration and fleet output on DevLab
        shell: bash
        run: |
          bash "$PWD/skills/loom-setup/scripts/install_loom.sh" "$WORK/sdk" 0.3.0 \
            2>&1 | tee "$WORK/evidence/install.log"
          cp "$WORK/sdk/loom-install.json" "$WORK/evidence/sdk.json"
          grep -Fq 6252bb0df262351175bdb2c4aaca22ffa63d80d791659aa4d2fa5c92a0af426f "$WORK/evidence/sdk.json"
          py="$WORK/sdk/.tools/bin/python"
          "$py" -m pip install -q pyyaml huggingface_hub
          export PATH="$WORK/sdk/.venv/bin:$PATH"
          export HF_ENDPOINT=https://huggingface.co
          "$py" -m unittest discover -s tests -p test_regen.py > "$WORK/evidence/test-regen.log" 2>&1 || { tail -100 "$WORK/evidence/test-regen.log"; exit 1; }
          "$py" -m unittest discover -s tests -p test_ab_jobs.py > "$WORK/evidence/test-ab-jobs.log" 2>&1 || { tail -100 "$WORK/evidence/test-ab-jobs.log"; exit 1; }
          "$py" fleet/scope_lint.py --local --head HEAD --base origin/main \
            --scope-block $'kind: architecture\nscopes: -\nkernels: -' --work "$WORK/scope" \
            --json "$WORK/evidence/scope.json" 2>&1 | tee "$WORK/evidence/scope.log"
          bash "$PWD/skills/loom-setup/scripts/install_loom.sh" "$WORK/control-sdk" release:0.2.0 \
            2>&1 | tee "$WORK/evidence/install-control.log"
          cp "$WORK/control-sdk/loom-install.json" "$WORK/evidence/control-sdk.json"
          PATH="$WORK/control-sdk/.venv/bin:$PATH" LOOM_ROOT="$WORK/control-sdk" \
            "$py" fleet/build_fleet.py --ref "${{ github.event.pull_request.base.sha }}" --out "$WORK/base" --jobs 8 \
            2>&1 | tee "$WORK/evidence/base-build.log"
          LOOM_ROOT="$WORK/sdk" "$py" fleet/build_fleet.py --tree "$PWD" --out "$WORK/head" --jobs 8 \
            2>&1 | tee "$WORK/evidence/head-build.log"
          "$py" fleet/diff_fleet.py "$WORK/base" "$WORK/head" --raw-spelling \
            --json "$WORK/evidence/program-diff.json" --md "$WORK/evidence/program-diff.md"
          cat "$WORK/evidence/program-diff.md"
      - name: Retain migration proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk030-migration-implementation
          path: ${{ env.WORK }}/evidence
          retention-days: 30
      - name: Remove runner scratch
        if: always()
        shell: bash
        run: rm -rf -- "$WORK"

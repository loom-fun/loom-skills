name: DevLab image port PR 1340
on:
  push:
    branches: [codex/sdk030-image-pr1340-devlab]
    paths: [.github/workflows/sdk030-image-pr1340-devlab.yml, .github/sdk030-image-pr1340/**]
permissions:
  contents: read
concurrency:
  group: sdk030-image-pr1340-devlab
  cancel-in-progress: false
jobs:
  image-port:
    runs-on: [strix-halo, devlab-dispatch, Linux, self-hosted]
    timeout-minutes: 130
    env:
      PR_HEAD: d48f43191a8d9db165d205223426b831dc382add
      CATALOG_HEAD: ccd62d6a49576f25efdb7deef7b6f81a7b76fd6c
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create isolated workspace
        shell: bash
        run: |
          work=$(mktemp -d "$RUNNER_TEMP/sdk030-image-pr1340.XXXXXX")
          mkdir "$work/evidence"
          echo "WORK=$work" >> "$GITHUB_ENV"
      - name: Verify the exact PR head and the staged SDK image gate
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: bash .github/sdk030-image-pr1340/qualify.sh
      - name: Run the pinned Diffusers ROCm oracle and same-noise parity CLI
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: bash .github/sdk030-image-pr1340/oracle.sh
      - uses: actions/upload-artifact@v4
        if: always() && env.WORK != ''
        with:
          name: sdk030-image-pr1340-final-evidence
          path: ${{ env.WORK }}/evidence
          if-no-files-found: error
      - name: Remove isolated workspace
        if: always() && env.WORK != ''
        shell: bash
        run: |
          case "$WORK" in
            "$RUNNER_TEMP"/sdk030-image-pr1340.*) rm -rf -- "$WORK" ;;
            *) exit 1 ;;
          esac
